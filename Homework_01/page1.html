# Вступ: про що заняття ✓
Сьогодні ми ще раз проходимо **базовий workflow роботи з Git**. Потрібно чітко розуміти послідовність дій і механізм взаємодії з локальним і віддаленим репозиторіями. Особливо на початку багато проблем виникає саме через те, що цього не розуміють: наприклад, коли об’єднують гілку з `main` і з’являються конфлікти.

План заняття:
1. Базовий workflow: усі кроки від початку до кінця.
2. Конфлікти: як вони виникають і як їх розв’язувати. Ми змоделюємо ситуацію й пройдемо її на практиці.
3. Огляд презентацій і відео за темою HTML і CSS: ці матеріали студенти опрацьовують самостійно, а наступне заняття буде повним ревʼю з відповідями на запитання.

# Базовий workflow роботи з Git ✓
Будь-яка робота з локальним і віддаленим репозиторіями починається з однієї дії: **перейти в локальний репозиторій**. Це один із найважливіших кроків усього процесу.

## Крок 1. Перевірити стан
Виконати `git status` і переконатися, що немає **незакомічених змін**, які випадково можуть потрапити до наступної гілки.

## Крок 2. Оновити основну гілку
Саме цей крок студенти найчастіше пропускають. Усі домашні й практичні завдання зберігаються в `main`, тож це **спільна база** розробки. Перед будь-яким новим завданням потрібно отримати її актуальний стан.
- Віддалений `main` оновлюється після злиття pull request, але **локальний сам не оновлюється**.
- Якщо створити гілку від застарілого `main`, у ній не буде змін, які вже внесли інші розробники чи ви самі в попередньому pull request. Це ускладнює інтеграцію й призводить до додаткових конфліктів.

```bash
git switch main                       # перейти на main
git pull                              # стягнути актуальний стан із віддаленого main
```
> **Правило:** кожне нове завдання починаємо з оновлення локального `main`.

## Крок 3. Створити окрему гілку
Окрема гілка **ізолює зміни** конкретного завдання від основної версії проєкту. Можна змінювати файли, виправляти помилки, робити коміти, і це не впливає на `main`. Кожна гілка має власну історію змін, тож результат перевіряють незалежно й об’єднують з основною гілкою лише після завершення завдання.

Нова гілка створюється на основі **актуального** `main`. Працюємо в ній і не чіпаємо `main`, доки завдання не буде завершено.

# Зміни, status, add і commit ✓
## Крок 4. Змінити файли
Створюємо нові файли або змінюємо наявні відповідно до умов завдання. На цьому етапі всі зміни існують лише в **робочому каталозі** й ще не є частиною історії Git.

Після редагування перевіряємо, що саме змінено, додано чи видалено. Це гарантує, що до майбутнього коміту потраплять лише зміни, які стосуються поточного завдання.
- **`git status`** показує поточний стан: які файли відстежуються, які ні, що змінено. У текстовому форматі.
- **`git diff`** показує, що саме змінилося всередині файлів: нове підсвічується зеленим.

## Крок 5. Підготувати зміни та створити коміт
```bash
git add .                             # підготувати всі змінені файли
git commit -m "Додавання заголовка"   # зафіксувати
```
- `git add .` додає до індексу всі змінені файли. Якщо потрібні не всі, додають за назвою файлу. Коли файлів багато, `.` зручніший за перелік по черзі.
- Є команда з параметром, що дозволяє перевірити, що саме буде включено до коміту (це `git diff --staged`).
- **Не пропускай перевірку** `git status` перед комітом: `git add .` може захопити випадково змінені файли.
- `git commit` створює нову точку в історії проєкту.

> Пояснення: у субтитрах параметр для перегляду підготовлених змін розпізнано нечітко. Зазвичай це `git diff --staged`.

**Коміт має бути логічно завершеною зміною**, а повідомлення має зрозуміло пояснювати, що зроблено. Це забезпечує можливість відстежувати історію розробки, аналізувати зміни й за потреби повертатися до попередніх версій.

# Публікація, pull request і злиття ✓
## Крок 6. Опублікувати гілку на GitHub
Після коміту зміни лежать лише в **локальному** репозиторії. Щоб вони стали доступними іншим учасникам або викладачу, робочу гілку потрібно передати у віддалений репозиторій.
```bash
git push -u origin homework-02
```
Прапорець `-u` встановлює зв’язок між локальною та віддаленою гілкою, тож надалі достатньо короткої команди без додаткових параметрів. **Публікація гілки ще не означає потрапляння змін до `main`**: ми лише передаємо результат на GitHub, де його можна перевірити.

## Крок 7. Створити pull request
Це можна зробити через веб-інтерфейс або термінал. Pull request це не просто механізм об’єднання гілок, а важливий інструмент **контролю якості** коду: можна переглянути змінені файли, проаналізувати й обговорити реалізацію та **перевірити можливість об’єднання без конфліктів**. Якщо конфлікти виникають, їх треба розв’язати саме тут.

## Крок 8. Об’єднати гілку з main
Після перевірки та усунення проблем виконуємо злиття робочої гілки з основною. Поки що робимо це у веб-інтерфейсі для простоти, а як робити те саме з терміналу, лекторка покаже пізніше.

## Що дає такий workflow
Кожен етап має своє призначення:
- оновлення `main` дає актуальність версії продукту;
- окрема гілка дає незалежність змін;
- коміт фіксує результат;
- публікація на GitHub робить зміни доступними команді, викладачу чи для віддаленого зберігання;
- pull request дає перевірку;
- злиття завершує завдання.

Після завершення одного завдання цикл повторюється: повертаємося до кроку 1, отримуємо останні зміни й створюємо нову гілку. Дотримання цієї послідовності дозволяє кільком людям одночасно працювати над одним проєктом (студентам працювати, а викладачу перевіряти) й **не порушувати стабільність основної версії**.

# Конфлікти: що це і чому виникають ✓
Конфліктів **не треба лякатися**. Перша реакція може бути складною, але це досить поширена ситуація: Git не може автоматично об’єднати зміни з різних гілок чи версій проєкту, бо вони суперечать одна одній.

**Найчастіші причини:**
- двоє розробників змінили **ті самі рядки** одного файлу, наприклад додали різні фрагменти завдання в одне й те саме місце;
- в одній гілці файл **видалили**, а в іншій **змінили**.

Конфлікти виникають під час команд, коли Git намагається об’єднати різні зміни. Нам потрібно вміти їх розв’язувати й розуміти, як не припускатися зайвих конфліктів.

# Моделюємо конфлікт: дві гілки ✓
**Ситуація.** У нас є `main` і гілка `homework-01` з минулого заняття. Створимо ще одну, `homework-02`, і внесемо в **той самий файл** `index.html` різні зміни в обох гілках. Потім об’єднаємо їх з `main` і побачимо конфлікт.

## Підготовка
```bash
cd шлях/до/репозиторію                # завжди перевіряй, що ти у правильній теці
git status                            # немає незакомічених змін
git switch main                       # перейти на main
git pull                              # обов’язково оновити
git branch homework-02                # створити гілку (автоматично вона не активна)
git switch homework-02                # перемкнутися
git branch                            # перевірити, де ми
```
Нова гілка створюється на основі актуального `main` і вже містить усі файли, які злито в нього.

## Зміна в гілці homework-02
1. У `index.html` додаємо заголовок другого рівня (`h2`), зберігаємо файл.
2. `git status`: файл змінено. `git diff`: зеленим підсвічено нове.
3. `git add .`, потім `git commit -m "Додавання заголовка другого рівня"`.

## Зміна в гілці homework-01
```bash
git switch homework-01                # у цій гілці заголовка ще немає
```
1. У тому самому місці `index.html` додаємо **інший** заголовок другого рівня, зберігаємо.
2. `git status`, `git add .`, `git commit -m "Повторне додавання заголовка другого рівня"`.

## Публікація обох гілок
```bash
git push -u origin homework-01        # перевірити, що перебуваємо у homework-01
git switch homework-02
git push -u origin homework-02        # GitHub одразу пропонує створити pull request
```
Кожна гілка має власні зміни, але **жодну ще не об’єднано з main**. На GitHub видно дві гілки з повідомленнями про створення pull request.

# Розв’язання конфлікту на GitHub ✓
## Перший pull request: без проблем
Створюємо pull request для `homework-01` (заголовок «Повторне додавання заголовка другого рівня»). GitHub показує зміни порівняно з актуальним станом і повідомляє, що **конфліктів немає**, тож гілку спокійно зливаємо в `main`.

## Другий pull request: конфлікт
Для `homework-02` GitHub повідомляє, що **не може автоматично об’єднати зміни**, бо між гілками виявлено конфлікт. Pull request створити можна, але злити його не вдасться, поки конфлікт не розв’язано.

## Як розв’язати
1. Натискаємо кнопку розв’язання конфліктів. Відкривається **веб-редактор конфліктного файлу**.
2. У файлі видно **маркери конфліктів**. Вони позначають суперечливі версії: версію однієї гілки й версію іншої.
3. Аналізуємо обидві версії й визначаємо **остаточний вміст** файлу. Можна залишити одну версію, обидві чи переписати фрагмент. У прикладі обидва заголовки мають залишитися в `index.html`.
4. **Видаляємо маркери**, вони не потрібні.
5. Позначаємо конфлікт як розв’язаний і створюємо коміт.
6. Знову виконується перевірка. Якщо конфліктів немає, виконуємо злиття в `main`.

Після цього зміни з `homework-02` також потрапляють у `main` разом із розв’язаним конфліктом.

> Пояснення: розв’язання конфлікту не зводиться до видалення маркерів. Це **свідоме узгодження** змін різних розробників, а потім перевірка, що проєкт працює. Коли конфліктів немає, у веб-редакторі працювати не доводиться.

# Синхронізація і видалення гілок ✓
## Синхронізація main
Після злиття pull request потрібно повернутися в термінал, бо там простіше працювати:
```bash
git switch main                       # перейти на main
git pull origin main                  # забрати оновлення (так прозвучало в лекції)
git status                            # все гаразд
git branch -a                         # усі гілки: локальні та віддалені
```
`git pull` стягує актуальний стан віддаленої гілки в локальний репозиторій. `git branch -a` показує всі гілки, і локальні, і віддалені.

> Пояснення: у субтитрах команда розпізнана нечітко. Достатньо `git pull`, якщо гілку вже пов’язано з віддаленою через `-u`.

## Видалення непотрібних гілок
**Правило:** гілки, які більше не потрібні, краще видаляти. Якщо завдання виконано й зміни злито, гілка свою роль виконала. Зайві гілки створюють плутанину й захаращують репозиторій.

```bash
git branch -d homework-01             # видалити локальну гілку (безпечно)
git branch -d homework-02
git push origin --delete homework-01  # видалити віддалену гілку на GitHub
git push origin --delete homework-02
git fetch --prune                     # прибрати застарілі посилання на віддалені гілки
git branch -a                         # лишилися тільки main (локальна й віддалена)
```
- `-d` (маленьке) видаляє гілку **безпечно**: Git перевіряє, що її злито.
- Буває, що `-d` не спрацьовує з різних причин. Тоді є **примусове видалення**: `-D` (велике). Але з ним треба бути обережним: можна втратити незлиті зміни.
- Після видалення віддалених гілок краще очистити й локальні посилання на них.

> Пояснення: у субтитрах команда видалення віддаленої гілки і команда очищення названі нечітко. Тут наведено `git push origin --delete` (як показано на попередній лекції) і `git fetch --prune`.

Так ми розглянули всі ключові моменти розв’язання конфліктів: на яких етапах вони виникають, з якими командами пов’язані й як їх розв’язувати. Далі на заняттях цей workflow доповнюватиметься новими командами, прикладами й кейсами.

# Правила роботи з Git ✓
Це основні рекомендації для роботи з Git і GitHub. Вони стосуються не лише навчання, а й **реальних проєктів**: допомагають уникати зайвих конфліктів, вчасно контролювати зміни й підтримувати стабільність роботи команди й основного продукту.

1. **Починай нове завдання з актуального `main`.** Застаріла `main` це одна з головних причин конфліктів під час об’єднання.
2. **Кожне завдання виконуй в окремій гілці.** Так ти ізолюєш зміни й працюєш незалежно від інших розробників і завдань. Наприклад, якщо перше завдання не встигли завершити й воно лишилося в гілці, а прийшло друге, створюєш нову гілку, стягуєш у неї актуальний `main` і продовжуєш. Якщо ж у другому завданні змінити файли першого, конфлікт можливий, але ти вже знаєш, як його розв’язати. Цю практику можна потренувати вдома.
3. **Не змішуй незалежні зміни в одному коміті.** Кожен коміт має містити логічно пов’язані зміни. Наприклад, виправлення домашнього завдання за рекомендаціями робимо в окремій гілці й окремим комітом, а не змішуємо з усім іншим.
4. **Регулярно синхронізуй робочу гілку з `main`.** Якщо робота над завданням тривала довго, основна гілка могла змінитися. Періодично підтягуй актуальні зміни з `main` у свою робочу гілку: так конфлікти виявляються раніше, коли їх ще відносно легко розв’язати. Важливо розрізняти оновлення `main` через `git pull` і включення її змін у робочу гілку.
5. **Перевіряй зміни перед комітом.** Використовуй `git status` і `git diff`. `git add .` може додати до коміту й випадково змінені файли, тож рухайся обережно.
6. **Пиши зрозумілі повідомлення комітів.** Не годяться загальні «update» чи «зміни»: вони мають бути інформативними й розгорнутими. Історія комітів це **документація розвитку проєкту**: з неї видно, що й коли змінювалося.
7. **Перевіряй працездатність проєкту перед злиттям.** До `main` має потрапляти лише актуальна, робоча версія.
8. **Не використовуй примусові команди без розуміння наслідків.** Наприклад, `git branch -D` (примусове видалення гілок) чи переписування історії комітів. Такі команди можуть призвести до втрати збережених змін. Особливо небезпечне примусове перезаписування історії спільних комітів.
9. **Після завершення завдання створюй pull request.** Він дозволяє переглянути зміни, обговорити реалізацію, перевірити можливість об’єднання й розв’язати конфлікти. Це важливий етап **контролю якості** коду.

**`git push` лише публікує** зміни на GitHub, а pull request організовує їх перевірку й подальше включення до основної гілки.

## Конфлікти: головні висновки
- Якщо виник конфлікт, спочатку проаналізуй його причину. Розв’язання це **не просто видалення маркерів**, а свідоме узгодження змін різних розробників.
- Після розв’язання перевір працездатність коду, а потім виконуй злиття.
- Конфлікти це природний наслідок паралельної роботи над одним проєктом, і їхня поява **не свідчить про помилки розробника**.
- Правила (організація гілок, регулярна синхронізація, невеликі логічні коміти, перевірка змін перед злиттям) значно зменшують кількість складних конфліктів.
- Ефективна робота з Git полягає не лише в знанні команд, а й у розумінні, **коли, навіщо й у якій послідовності** їх використовувати.

# Домашнє завдання і матеріали ✓
Далі лекторка швидко пояснює домашнє завдання й тему, яку винесено на наступне заняття. Усе це подано у двох відео й презентаціях. Тих, хто ще не переглянув відео, чекають вихідні на те, щоб наздогнати матеріал. Курс інтенсивний, матеріали досить вичерпні, а запитання можна ставити в чаті.

До наступного заняття (вівторок) потрібно виконати **практичну роботу** з каскадними таблицями стилів: це не так страшно, як здається, бо вся реалізація є у відео й на слайдах. Результат: гарна сторінка. Зображення потрібно підібрати самостійно.

Відео про CSS викладуть після заняття, приблизно через півгодини. Другу частину питання (CSS) студенти опрацьовують самостійно, і на наступному занятті проведуть повне ревʼю з відповідями на запитання.

# HTML: структура і семантика ✓
**HTML** — мова розмітки, яка визначає структуру й зміст веб-сторінки. Це **не мова програмування**: ми не описуємо алгоритми й обчислення, а визначаємо, з яких елементів складається документ і яке призначення має кожен.

## Елементи й атрибути
- Елемент зазвичай складається з **початкового (відкривального) тега**, **вмісту** та **кінцевого (закривального) тега**. Між тегами міститься текст, який відображається на сторінці.
- Додаткові характеристики задають **атрибути**. Вони не є окремими елементами документа, а лише уточнюють властивості конкретного елемента.

## Структура документа
- Службова частина **`head`** містить метадані.
- Розділ **`body`** містить основний вміст сторінки.
- Документ має **ієрархічну структуру**: одні елементи містять інші. Така вкладеність визначатиме, як ми звертатимемося до елементів засобами CSS.

> **DOM не дорівнює HTML-файлу.** HTML — вихідна розмітка, а DOM — об’єктне подання документа, з яким працює браузер. До цього ми ще повернемося.

## Семантика
- Заголовки `h1`–`h6` слугують не для отримання тексту різного розміру, а для побудови **логічної ієрархії** документа. Заголовок першого рівня `h1` не можна використовувати кілька разів на сторінці: це порушення.
- **Списки** бувають різних типів: маркований (`ul`) і нумерований (`ol`), в обох використовуються вкладені елементи списку. Вони відрізняються не лише маркерами чи нумерацією, а й призначенням: у `ul` порядок елементів не принциповий, а в `ol` (впорядкований список) порядок має значення.
- Атрибут **`id`** призначений для однозначного визначення елемента в документі, а **`class`** може застосовуватися до багатьох елементів. Розуміти різницю між ними особливо важливо для CSS-селекторів.
- **`div`** — універсальний контейнер для групування інших елементів. Сам по собі він не має особливого смислового призначення, але дозволяє організувати блоки сторінки й застосувати до них спільні стилі.

## Практичне завдання
Лекторка показала структуру сторінки як набір `div`: окремі блоки й розділи, візуалізацію у вигляді **дерева**. **Кожен елемент має свій `id`**, і це важливо: у другій частині (відео про CSS) до цих `id` прив’язуватимуться правила оформлення. Структуру потрібно самостійно реалізувати за слайдами. Це домашнє завдання на вівторок.

Корисні ресурси: посилання на довідники й валідатори є на слайдах. Також рекомендовано **розширення для VS Code** з живим переглядом: поруч два вікна, в одному пишеш код, у другому одразу бачиш результат, без перемикання між редактором і браузером.

# CSS: підключення і селектори ✓
Після створення структури сторінки каскадні таблиці стилів (**CSS**) допомагають її оформити відповідно до референсу.

## Розділення структури й оформлення
HTML визначає, **що саме** розміщено на сторінці, а CSS визначає, **як це виглядає**. Завдяки цьому оформлення можна змінювати, не переписуючи HTML-структуру. До появи CSS у тегах були спеціальні атрибути для вирівнювання, кольору шрифту й фону. З появою CSS стало набагато зручніше.

## Три способи підключення CSS
1. **Атрибут `style`** безпосередньо в HTML (вбудовані стилі).
2. **Елемент `style`** у `head` документа.
3. **Зовнішній файл** CSS.

На заняттях використовуватимемо **зовнішній файл** як основний варіант: він дозволяє централізовано керувати оформленням і повторно використовувати стилі.

## Селектори і правила
**Селектор** визначає, до яких елементів застосовується правило. Оголошення стилю складається з **властивості та її значення**.
```css
p {
  color: red;
}
```
Тут `p` це селектор, у фігурних дужках через двокрапку вказано властивість `color` і значення `red`.

У відео й презентації розглядаються категорії селекторів: **базові**, **комбінатори**, **псевдокласи та псевдоелементи**, **групування**. Є й порівняльна таблиця селекторів. Також у слайдах є посилання на додаткову інформацію, яку варто опрацювати. Теми про **шрифти й кольори** лекторка вважає зрозумілими без додаткових пояснень.

# Box model, каскад і специфічність ✓
## Блокова модель (CSS box model)
Кожен елемент можна розглядати як **прямокутну область**, яка складається з:
- **вмісту**;
- **внутрішніх відступів** (`padding`);
- **рамки** (`border`);
- **зовнішніх відступів** (`margin`).

Потрібно чітко розрізняти два поняття: `padding` створює простір **всередині елемента** між вмістом і рамкою, а `margin` визначає відстань **за межами елемента**. Неправильне використання цих властивостей це одна з найпоширеніших причин проблем із розташуванням блоків. Допомагає ілюстрація з презентації.

## Каскадність
Один елемент може одночасно відповідати кільком CSS-селекторам, і правила можуть задавати **різні значення тієї самої властивості**. Браузер має визначити, яке застосувати.

- Не завжди перемагає правило, записане останнім. Спочатку враховується **пріоритет і специфічність** селекторів, а порядок запису стає вирішальним за однакових інших умов каскаду.
- **Приклад з відео:** якщо абзац має клас (наприклад, `description`), а правила для нього з’являються і в селекторі класу, і в селекторі елемента, текст стане таким, як задано в правилі класу, бо **селектор класу має вищу специфічність**, ніж селектор самого елемента.

> Пояснення: на початку навчання ці конфлікти трапляються особливо часто. У відео й презентації є анімація: змінюєш одну властивість, і «ламається» ще десять елементів. Варто додатково вивчити специфічність за наданими посиланнями.

Далі на практиці до структури сторінки з першої презентації додаються стилі оформлення. Приклади є у відео й на слайдах, потрібно розбиратися, які властивості й селектори там використано, і отримати на виході сторінку, як на слайді.

# Flexbox і Grid ✓
Це дві сучасні технології побудови макетів, які також використовуються в практичному завданні.

## Flexbox
**Одновимірна** модель макетування: елементи розташовуються вздовж однієї **головної осі**, горизонтально або вертикально. Зручна для:
- навігаційних меню;
- груп кнопок і колонок;
- карток (наприклад, карток викладачів на сторінці).

Що важливо розуміти:
- різницю між **контейнером** і його **дочірніми елементами**: властивість `display: flex` задають батьківському контейнеру, після чого його безпосередні діти стають flex-елементами;
- різницю між **головною** і **поперечною** віссю: наприклад, `justify-content` керує вирівнюванням уздовж головної осі;
- напрямок осі змінює `flex-direction`: перехід від рядків (`row`) до стовпців (`column`) змінює напрямок головної осі.

## Grid
На відміну від flexbox, це **двовимірна** модель: дозволяє одночасно керувати розташуванням елементів і в рядках, і в стовпцях. Особливо зручний для складніших структур: багатоколонкових блоків, галерей, карток курсів. Добре підходить для **загального каркаса веб-сторінки**.

У слайдах є чіткі пояснення змін, а домашнє завдання також є на слайді: якщо слідувати відео й презентації, буде цікаво й корисно розібратися.

# Вступ: тема заняття ✓
Тема заняття: **мова JavaScript, середовище виконання та система типів**. Питання дуже об’ємне, тож лекторка намагається вкластися в годину й передусім зорієнтувати слухачів. Детальніше все буде розглянуто наступного заняття (у п’ятницю), яке буде суто практичним, з великою кількістю прикладів.

# Визначення: високорівнева динамічно типізована мова ✓
Офіційне визначення: JavaScript — **високорівнева, динамічно типізована мова програмування, що підтримує імперативний, об’єктно-орієнтований і функціональний підходи** до розроблення програмного забезпечення. Розберімо ці поняття.

- **Високорівнева мова** забезпечує високий рівень абстракції від апаратної архітектури комп’ютера й дозволяє розробляти програми, **не керуючи безпосередньо низькорівневими ресурсами** обчислювальної системи.
- **Динамічна типізація** — механізм, за якого тип даних визначається **під час виконання** програми й пов’язується **зі значенням, а не зі змінною**. У мовах із статичною типізацією тип визначають під час створення змінної, і його контролює компілятор. У JavaScript одна змінна може послідовно зберігати значення різних типів. Це може бути як зручним, так і джерелом несподіванок, і далі ми це враховуватимемо під час написання програм.
- **Імперативне програмування** — опис алгоритму як послідовності інструкцій, що змінюють стан програми.
- **Об’єктно-орієнтоване програмування** — організація програми у вигляді взаємодіючих об’єктів, що поєднують дані й методи їх обробки.
- **Функціональне програмування** — обчислення організовуються переважно через виклик і композицію функцій, з акцентом на **мінімізацію змін стану й побічних ефектів**.

JavaScript належить до **мультипарадигмових** мов: можна поєднувати підходи залежно від завдання й архітектури програми. Це сучасна мова з багатьма перевагами, але й з тонкощами, які потрібно знати.

# Де застосовується JavaScript ✓
Мова створювалася для **інтерактивної поведінки на веб-сторінках**, але нині використовується значно ширше.

- **Клієнтські застосунки:** інтерактивні інтерфейси, обробка дій користувача, динамічне оновлення сторінок. Приклади: Gmail, Google Maps, освітні платформи.
- **Серверні застосунки:** обробка запитів, бізнес-логіка, взаємодія з базами даних, веб-сервери й API. Наприклад, інтернет-магазин має серверну частину (бекенд), системи авторизації користувачів. Основна технологія: **Express.js**.
- **Автоматизація процесів:** автоматичне виконання повторюваних операцій, обробка даних, тестування. Приклад: автоматизоване тестування веб-застосунків за допомогою **Playwright**, обробка JSON-файлів, формування звітів.
- **Інструменти командного рядка:** програми, що запускаються й керуються через термінал. Яскравий приклад, з яким ми працюватимемо: **npm**, менеджер пакетів JavaScript.
- **Платформні застосунки:** програми для різних операційних систем зі спільною кодовою базою. Приклад: **Discord**, побудований на Electron. Також мобільні застосунки.

Отже, JavaScript це універсальна мова, яку застосовують не лише для інтерактивних веб-сторінок, а й для повноцінних клієнтських, серверних, мобільних застосунків і засобів автоматизації.

# Ключові особливості мови ✓
1. **Високорівневість.** Розробник працює з абстракціями (змінні, функції, об’єкти, масиви) і не керує розміщенням даних у пам’яті. Пам’ять керується автоматично: виділяється для значень і об’єктів, а механізм **збирання сміття** (garbage collection) звільняє пам’ять, зайняту недосяжними об’єктами. Керування зовнішніми ресурсами може потребувати окремих дій програми.
2. **Динамічна типізація.** Змінна не закріплена за одним типом.
3. **Підтримка кількох парадигм.** Код можна організовувати функціями, об’єктами, класами. Функції це повноцінні значення.
4. **Автоматичне керування пам’яттю.**
5. **Виконання в різних середовищах:** у браузері й поза ним (Node.js).

Це не лише інструмент для інтерактивних сторінок, а **самостійна мова програмування** зі своєю системою типів, правилами виконання операцій, механізмами керування пам’яттю й моделлю роботи з об’єктами.

# Стандарт ECMAScript ✓
**ECMAScript** це міжнародний стандарт, що визначає специфікацію мови: синтаксис, систему типів даних, оператори, об’єкти, функції, правила виконання коду. Його призначення: **єдині принципи реалізації мови** й сумісність програм у різних середовищах виконання, незалежно від браузера чи платформи.

Стандарт розробляє й підтримує міжнародна організація, а безпосередньо над його розвитком працює технічний комітет **TC39**: представники технологічних компаній, розробники й експерти. Комітет розглядає пропозиції щодо вдосконалення мови, розробляє нові можливості й координує їх включення до специфікації. Посилання на стандарт і документацію є на слайді; документація основа для подальшої роботи.

## Три поняття, які треба розрізняти
Іноді їх плутають, але кожне означає своє:
1. **Стандарт** (ECMAScript): описує мову та її поведінку.
2. **JavaScript:** мова, реалізована відповідно до стандарту.
3. **Рушій:** програмний компонент, що виконує код.

Приклад розмежування: стандарт визначає, як працює оператор додавання чи порівняння двох значень, але **не визначає всі можливості браузера**: роботу з HTML-документами, подіями користувача, мережевими запитами. Їх забезпечують додаткові інтерфейси середовища виконання. Тож **мова й середовище, в якому вона виконується, це не одне й те саме**.

# Інтерпретація і компіляція ✓
Для виконання програми мало мати текст вихідного коду. Потрібне **середовище**, яке забезпечує інтерпретацію чи компіляцію, доступ до пам’яті й взаємодію із зовнішніми ресурсами.

- **Інтерпретація** це спосіб виконання, за якого інтерпретатор безпосередньо виконує інструкції вихідної програми (або її проміжного подання) **без створення окремого виконуваного файлу**.
- **Компіляція** це перетворення вихідного коду на іншу форму: машинний код чи байт-код, придатну до виконання.
- У сучасних рушіях обидва механізми **поєднуються**: код спочатку перетворюється на внутрішнє подання, а під час виконання окремі частини додатково компілюються й оптимізуються для підвищення продуктивності.

# Рушії JavaScript ✓
**Рушій** це програмний компонент, що аналізує й виконує код. Основні рушії:
- **V8**: розробник Google, використовується в браузері Chrome (а також у Node.js);
- **SpiderMonkey**: Firefox;
- **JavaScriptCore**: Apple, Safari.

> Пояснення: у субтитрах назви рушіїв і їхніх розробників розпізнано з помилками, тут наведено загальновідомі відповідності.

Кожен рушій має власну архітектуру й механізми оптимізації, але **всі реалізують вимоги стандарту**. Саме це забезпечує узгоджену поведінку програм у різних браузерах і середовищах. Код виконується **не самим браузером безпосередньо, а вбудованим у нього рушієм**.

## Як рушій обробляє код (спрощена схема)
1. Вихідний код передається рушієві, який виконує **синтаксичний аналіз (parsing)**: перевіряє відповідність правилам мови й формує внутрішнє подання, зокрема **абстрактне синтаксичне дерево** (AST).
2. Далі відбувається **компіляція та виконання**: програмні конструкції перетворюються на інструкції, придатні для виконання. За потреби застосовується додаткова компіляція в машинний код та оптимізація.
3. Під час виконання здійснюються обчислення, обробка даних, виклики функцій. Результат: виведення інформації, зміна стану об’єктів, взаємодія із зовнішнім середовищем.

Схема узагальнена: реальні рушії можуть мати кілька рівнів компіляції, інтерпретатори байт-коду й оптимізувальні компілятори. Тому поширене твердження, що JavaScript лише **інтерпретується**, не зовсім точне: сучасні рушії **поєднують інтерпретацію з компіляцією** під час виконання.

# Виконання в браузері: консоль ✓
Код можна виконувати в кількох середовищах. Перше: **браузер**.
- Відкриваємо панель розробника й переходимо до **консолі**. Браузер надає доступ до об’єктної моделі документа, обробки подій, мережевих інтерфейсів та інших можливостей.
- Проста команда виведення: `console.log("Hello, JavaScript!")`, і в консолі з’являється повідомлення.
- Можна керувати й самою веб-сторінкою: через об’єкт `document` отримуємо доступ до `body` і змінюємо властивість `backgroundColor` у `style`, наприклад на світло-блакитний. Колір фону сторінки миттєво змінюється.

```javascript
console.log("Hello, JavaScript!");
document.body.style.backgroundColor = "lightblue";
```
**Важливо:** об’єкт `document` **не є частиною ядра мови**, його надає браузер.

# Node.js ✓
Друге середовище: **Node.js**, середовище виконання JavaScript **поза браузером** на рушії V8. Воно дозволяє створювати серверні застосунки, працювати з файловою системою, мережею, процесами й операційною системою. Ми будемо використовувати його в розробці власного проєкту.

На відміну від браузера, у звичайному середовищі Node.js **немає глобального об’єкта `document`**: Node.js не працює безпосередньо з документом. Отже, **той самий синтаксис** можна використовувати в різних середовищах, але набір доступних API залежить від середовища виконання.

# Підключення скрипта до HTML ✓
У веб-розробці JavaScript найчастіше використовується разом з HTML і CSS: **HTML** визначає структуру, **CSS** відповідає за візуальне оформлення, **JavaScript** реалізує програмну логіку й інтерактивну поведінку.

Для підключення використовується елемент **`script`**. Можна написати код прямо між відкривальним і закривальним тегами (не забуваємо закрити тег) і побачити результат у консолі. Але це **не дуже добра практика**: у реальних проєктах так зазвичай не роблять.

# Зовнішній файл скрипта і defer ✓
Код відокремлюють від HTML. У проєкті поряд з `index.html` і `style.css` створюємо файл `script.js`, пишемо в ньому код (наприклад, `console.log(...)`) і підключаємо до `index.html` у `head` через атрибут `src`, указавши ім’я файлу. Попередній код із HTML видаляємо, і скрипт усе одно виконується.

```html
<script src="script.js" defer></scr_ipt>
```
**Атрибут `defer`** використовується для зовнішніх класичних скриптів: браузер **завантажує файл паралельно з обробкою документа**, але виконання скрипта **відкладається до завершення синтаксичного аналізу** HTML. Відкладені скрипти виконуються в порядку їх розташування в документі. Докладніше про це поговоримо далі.

**Навіщо зовнішні файли:** вони забезпечують логічне розділення структури сторінки й програмного коду, спрощують супровід і повторне використання функціональності. У наших проєктах ми так і робитимемо: на заняттях трохи попрацюємо з консоллю, але основну увагу приділимо правильній структурі проєкту й відокремленню JavaScript від HTML.

# Змінні та константи ✓
**Змінна** це **іменована прив’язка**, що забезпечує доступ до певного значення в межах відповідної області видимості. Під час виконання програми значення змінної може змінюватися відповідно до правил її оголошення. Конкретний спосіб зберігання значень у пам’яті визначається реалізацією рушія.

**Ім’я змінної** за специфікацією називається **ідентифікатором**. Він дозволяє звертатися до збереженого значення, використовувати його в обчисленнях і функціях та змінювати в процесі виконання. Під час оголошення середовище виконання створює **прив’язку між ім’ям і значенням**, а доступ до даних визначають правила області видимості.

## Динамічна типізація на прикладі
На відміну від мов зі статичною типізацією, змінна **не має фіксованого типу**. Тип визначається значенням, яке їй присвоєно.
```javascript
let data = 100;       // число (number)
data = "текст";       // тепер рядок (string)
data = true;          // тепер логічне значення (boolean)
```
Змінна `data` та сама, змінюються лише її поточне значення й відповідний тип. Це фундаментальна особливість JavaScript: **тип пов’язаний зі значенням, а не зі змінною**. Змінні, оголошені через `let`, можна повторно присвоювати значення різних типів без повторного оголошення. З одного боку, це зручно, з іншого, часто призводить до несподіваних ситуацій, якщо цю особливість не враховувати.

## Ключові слова оголошення
Для оголошення змінних використовують **`let`**, **`const`** і **`var`**. Кожне визначає:
- правила створення змінної;
- можливість повторного присвоєння;
- **область видимості** й особливості доступу під час виконання.

Вибір між ними має принципове значення: від нього залежить, у яких частинах програми змінна доступна, коли можна отримати її значення й які операції з нею дозволені. Для розуміння потрібні поняття **області видимості, підняття оголошень і тимчасової мертвої зони**.

# Оголошення, ініціалізація, присвоєння ✓
Потрібно чітко розрізняти три операції зі змінними:
- **оголошення**: введення ідентифікатора змінної у відповідну область видимості;
- **ініціалізація**: надання змінній початкового значення; після цього до неї можна звертатися за правилами мови;
- **присвоєння**: встановлення значення змінної; якщо прив’язка це допускає, присвоєння може виконуватися багаторазово.

# let і блокова область видимості ✓
Ключове слово **`let`** оголошує змінні, значення яких може змінюватися під час виконання. Його запровадив стандарт 2015 року як сучасну альтернативу традиційному `var`.

```javascript
let count = 0;    // оголошення й ініціалізація
count = 5;        // повторне присвоєння
```
Перша інструкція оголошує змінну й ініціалізує її числом `0`. Друга **повторно присвоює** значення: ідентифікатор лишається тією самою прив’язкою, змінюється лише поточне значення.

## Блокова область видимості
Основна характеристика `let`: **блокова область видимості**. **Область видимості** це частина коду, у межах якої ідентифікатор можна використовувати для доступу до змінної. Її визначає лексичний контекст, у якому створено прив’язку: це може бути блок у фігурних дужках, тіло циклу чи умовної конструкції. Змінну, оголошену всередині блоку, **неможливо використати за його межами**. Це запобігає випадковому використанню локальних даних і зменшує ймовірність конфліктів між однаковими ідентифікаторами.

## Повторне оголошення заборонене
Для `let` **заборонено повторне оголошення** з тим самим ідентифікатором у межах однієї області видимості. Потрібно розрізняти:
- **повторне присвоєння** змінює значення вже створеної прив’язки, і воно **дозволене**;
- **повторне оголошення** це нова інструкція оголошення того самого ідентифікатора, і воно **заборонене**.

# const і TypeError ✓
Ключове слово **`const`** створює прив’язку, якій після ініціалізації **заборонено повторно присвоювати інше значення**.

```javascript
const pi = 3.14;
pi = 3;            // TypeError
```
Повторне присвоєння для `const` заборонене, тож під час виконання виникне **`TypeError`**: помилка, коли операція не може бути виконана за правилами мови для певного значення чи прив’язки. Тут причина в спробі присвоїти значення незмінній прив’язці.

## Обов’язкова ініціалізація
На відміну від `let` і `var`, звичайне оголошення `const` **потребує початкового значення**. Прив’язку можна ініціалізувати лише один раз, тож без значення подальше присвоєння було б неможливим. Відсутність ініціалізатора спричиняє **`SyntaxError`**, синтаксичну помилку, яка виявляється **до виконання** коду. Є спеціальні випадки (наприклад, конструкції циклів, де значення встановлює сам цикл), про них пізніше.

## Незмінність прив’язки не означає незмінність даних
`const` **не означає, що всі дані автоматично стають незмінними**.
```javascript
const user = { name: "Anna" };
user.name = "Maria";     // дозволено
```
Перша інструкція створює об’єкт із властивістю `name`, і ідентифікатор `user` пов’язується з цим об’єктом. Друга змінює властивість: це **внутрішній стан об’єкта**, а не прив’язка `user`. Тож `const` забороняє повторне присвоєння змінній, але **не забороняє змінювати властивості об’єктів чи елементи масивів**, якщо вони це допускають.

Для обмеження змінюваності об’єктів є окремі механізми, наприклад метод **`Object.freeze`**, але він дає лише **поверхове** обмеження, а не автоматичну незмінність усіх вкладених об’єктів. Приклади будуть далі.

Змінні `const` теж мають **блокову** область видимості, аналогічну `let`, і повторне оголошення в одній області заборонене. Отже, основна різниця між `let` і `const` не в області видимості, а **в можливості повторного присвоєння**.

# var і функціональна область видимості ✓
**`var`** це традиційний спосіб оголошення змінних. Він масово використовувався в ранніх версіях мови, лишається в стандарті для **сумісності зі старим кодом** і ще зустрічається. Це важливо, бо проєкти п’ятирічної чи десятирічної давнини живі й потребують підтримки, рефакторингу й нової функціональності.

```javascript
var name = "John";
name = "Mike";      // повторне присвоєння
```
За можливістю повторного присвоєння `var` схожий на `let`, але відмінностей багато:

- **Функціональна область видимості.** Змінна, оголошена всередині функції, доступна в усій функції, навіть якщо оголошення стоїть у вкладеному блоці. Звичайні блоки умов чи циклів **не створюють окремих областей видимості для `var`**. Через це змінна може лишатися доступною там, де цього не передбачалося.
- **Залежність від середовища.** Якщо змінну оголошено на верхньому рівні звичайного скрипта в браузері, створюється глобальна прив’язка й може створюватися властивість глобального об’єкта. Але в модулях змінні верхнього рівня належать власній області видимості й **не стають глобальними**. Тому твердження «`var` має глобальну область видимості» правильне лише з урахуванням контексту.
- **Повторне оголошення дозволене** в межах однієї області видимості. Це не дуже добра практика, але така можливість не означає, що будь-яке поєднання оголошень допустиме: є обмеження на використання однакових ідентифікаторів.

# Підняття оголошень і тимчасова мертва зона ✓
Перед виконанням інструкцій середовище робить **підготовку**: формує контекст виконання, створює прив’язки ідентифікаторів і встановлює їх початковий стан.

- **Контекст виконання** це внутрішня структура з інформацією, потрібною для виконання, зокрема посиланнями на відповідні середовища.
- **Лексичне середовище** визначає, які ідентифікатори доступні в певній частині програми та як здійснюється пошук прив’язок. У специфікації для опису прив’язок використовують поняття запису середовища. Через ці механізми реалізуються правила області видимості, ініціалізації й доступу до змінних.

**Підняття оголошень** (hoisting) **не означає фізичного переміщення** інструкцій на початок файлу. Це умовний термін для результатів підготовки середовища.

## Для let і const
Прив’язки створюються під час підготовки лексичного середовища, але **до моменту ініціалізації вони недоступні**. Звернення до такої змінної до виконання її оголошення спричиняє помилку **`ReferenceError`**. Період від створення прив’язки до її ініціалізації називають **тимчасовою мертвою зоною** (TDZ). Протягом нього звернення до змінної, оголошеної через `let` чи `const`, дає цю помилку.

Дві різні стани змінної:
- **неініціалізована прив’язка:** ідентифікатор уже належить області видимості, але отримати значення ще неможливо;
- **ініціалізована прив’язка:** змінна отримала початкове значення, і до неї можна звертатися за правилами області видимості.

Для `let` без явно заданого значення ініціалізація відбувається під час виконання оголошення. Для `const` ініціалізація здійснюється значенням, указаним в інструкції.

> Тимчасова мертва зона **не означає, що змінна фізично відсутня в пам’яті** чи що рушій «не знає» про оголошення. Йдеться про визначений специфікацією стан прив’язки, у якому доступ до значення ще заборонений.

## Для var
Під час підготовки середовища змінна створюється й **ініціалізується спеціальним значенням `undefined`**, тож звернення до неї до виконання присвоєння **не дає помилки**, а повертає `undefined`. Це одна з причин, чому `let` і `const` вважають **більш передбачуваними**.

Складні випадки (коли «все написали правильно, а отримали `ReferenceError`») лекторка розбере на наступному занятті на великій кількості прикладів.

# Практичні рекомендації: const, let, var ✓
У сучасній розробці на JavaScript:
- **`const` використовуємо за замовчуванням**, якщо повторне присвоєння змінній не передбачається. Це явно фіксує намір розробника не змінювати прив’язку після ініціалізації.
- **`let`** використовуємо, коли алгоритм справді потребує зміни значення під час виконання.
- **`var`** переважно трапляється в раніше створеному коді. У нових проєктах його використання зазвичай не рекомендується через функціональну область видимості, повторне оголошення й особливості ініціалізації.

Вибір між ними **не пов’язаний із типом даних**: усі способи дозволяють працювати з усіма типами значень. Відмінність у **можливості повторного присвоєння й правилах ініціалізації**.

Лекторка визнає, що для початку це непрості моменти й залишаються запитання. Тому наступне заняття буде присвячено **прикладам**, щоб розібратися у відмінностях між `let`, `const` і `var`.

# Система типів: примітивні типи ✓
JavaScript має **динамічну типізацію**: у процесі виконання програми одна змінна може послідовно отримувати значення різних типів. Система типів складається з двох груп: **примітивних** і **об’єктних** типів. Сьогодні мета лише дати уявлення про них, а докладніше розглянемо на наступному занятті.

## Примітивні типи
Вони призначені для представлення окремих значень. Головна характеристика: **незмінність (імутабельність)**. Після створення примітивне значення змінити не можна. Операції можуть створювати нові значення, але не змінюють наявні. Визначено **7 примітивних типів**:

1. **`string` (рядок).** Текстові дані. Значення записують в одинарних, подвійних або зворотних лапках. Рядки є послідовностями кодових одиниць **UTF-16**, і це важливо для визначення довжини й обробки символів Unicode: один видимий символ не завжди відповідає одній кодовій одиниці. Рядки теж незмінні: операції над ними створюють новий рядок.
2. **`number` (число).** Цілі й дробові значення. Використовує **64-бітний формат IEEE 754** (число з рухомою комою подвійної точності) і має обмежену точність: цілі числа гарантовано точні лише в діапазоні від `-(2^53 - 1)` до `2^53 - 1`. До `number` належать і спеціальні значення: **`NaN`** (not a number: результат некоректних числових операцій; назва «не число», але саме значення має числовий тип) та **`Infinity`** (додатна нескінченність; є й від’ємна).
3. **`bigint`.** Цілі числа **довільної точності**: для точного подання цілих, що виходять за межі безпечного діапазону `number`. Обмеження визначаються ресурсами середовища. Операції між `bigint` і `number` мають обмеження: їх не можна безпосередньо змішувати в арифметиці без явного перетворення типів (про це на наступному занятті).
4. **`boolean` (логічний).** Лише два значення: `true` і `false`. Застосовується в умовах, циклах, порівняннях і логічних виразах.
5. **`undefined`.** Невизначене значення, єдине значення цього типу. Автоматично отримує змінна, оголошена через `let` без початкового значення. Важливо розрізняти значення `undefined` і ситуацію, коли ідентифікатор **не оголошено або недоступний**: звернення до неіснуючого ідентифікатора зазвичай спричиняє `ReferenceError`, а `undefined` це звичайне значення окремого примітивного типу.
6. **`null`.** Єдине значення `null` для **явного позначення відсутності значення** (зокрема об’єкта), коли така відсутність передбачена логікою програми. Різниця з `undefined`: `null` зазвичай встановлюють **явно**, а `undefined` часто виникає через відсутність присвоєного значення або як результат певної операції.
7. **`symbol`.** Унікальні примітивні значення, які, зокрема, можуть бути ключами властивостей об’єктів. Кожен виклик `Symbol()` створює нове унікальне значення: навіть два символи з однаковим описом **не рівні**. Опис використовують для ідентифікації символу під час налагодження, але він не визначає унікальність.

# Об’єктні типи ✓
На відміну від примітивних значень, **об’єкти** призначені для організації даних у вигляді **властивостей** і реалізації складнішої поведінки. Об’єкт має **ідентичність** і може містити властивості, що пов’язують ключ зі значенням. Механізм **прототипів** дозволяє об’єктам успадковувати поведінку.

- **Звичайні об’єкти** групують пов’язані дані. Приклад: об’єкт з двома властивостями (ім’я й вік), кожна з яких має значення.
- **Масиви** це спеціалізовані об’єкти для зберігання впорядкованих колекцій значень. Про них окремо.
- **Функції** в JavaScript є об’єктами з додатковою можливістю **виклику**. Вони можуть виконувати код, приймати аргументи й повертати результат, а як об’єкти можуть мати власні властивості. Окремого фундаментального типу даних вони не утворюють, хоча `typeof` повертає для них спеціальний результат. Функціям присвятимо багато часу.
- **Інші спеціалізовані об’єкти:** `Date` (робота з датою й часом), об’єкти для **регулярних виразів**, колекції **`Map`** (пари «ключ-значення») та **`Set`** (колекція унікальних значень). Вони мають об’єктну природу, але відрізняються внутрішніми механізмами й доступними операціями.

Отже, система типів складається з двох груп: **примітивні типи** та **об’єктні типи**. Докладніше про кожну групу ми говоритимемо на наступному занятті, коли розглядатимемо теорію на практиці з великою кількістю прикладів.

(function(){const s=q("#s4");let ok=0,done=0,tot=0;Q.forEach(g=>tot+=g[1].length);
