# Головне за хвилину
- СКВ зберігає історію проєкту; Git — розподілена система: у кожного є повна копія репозиторію.
- Шлях змін: робочий каталог → індекс → коміт → віддалений репозиторій.
- Гілка — це вказівник на коміт, а не копія теки.
- Працюємо у своїй гілці, в main потрапляємо через pull request.
- Після злиття: switch на main, pull, видалити непотрібну гілку.
- Перед будь-якою командою дивись git status.

# Лекція 02. Основи Git і GitHub
## Навіщо потрібна СКВ
- Відстежує, зберігає й допомагає керувати змінами файлів проєкту протягом його життя.
- Дає історію версій, порівняння й відкіт, командну роботу, паралельну розробку в гілках, пошук конфліктів і авторство змін.
- Застосовується не лише до коду: конфіги, документація, будь-які ресурси проєкту.

## Три типи СКВ
- **Локальні:** історія на твоєму комп’ютері. Просто й автономно, але немає спільної роботи.
- **Централізовані:** головний репозиторій на сервері, у розробників робочі копії. Майже все залежить від доступності сервера.
- **Розподілені (Git):** у кожного повний репозиторій. Коміти, гілки та історія працюють автономно, обмін через push і pull.

> Пояснення: у централізованій системі без сервера не можна навіть переглянути історію. У Git сервер потрібен лише для обміну кодом.

## Як працює Git
1. **Знімки (snapshots).** Git фіксує стан усіх файлів, а не різницю між версіями.
2. **Економія місця.** Незмінений файл не копіюється, знімок посилається на вже збережений.
3. **Коміт** містить посилання на дерево файлів, автора, дату, повідомлення та посилання на батьківський коміт.
4. **Адресація за вмістом:** об’єкти мають криптографічний хеш, тому видно цілісність даних.

> Пояснення: хеш — це довгий ідентифікатор виду a1b2c3d, він потрібен, наприклад, щоб відкотитися до конкретного коміту.

## Архітектура Git
- **Робочий каталог:** тека з файлами, де ти правиш. Зміни до історії самі не потрапляють.
- **Індекс (staging):** зона підготовки наступного коміту. Дає змогу включити лише потрібні зміни.
- **Локальний репозиторій:** сховище в прихованій теці .git. Не видаляй її: зникне вся історія.
- **Віддалений репозиторій:** GitHub, GitLab. Потрібен для обміну кодом. Для особистої роботи не обов’язковий.

> Пояснення: add і commit — це два кроки, щоб збирати логічно завершені коміти: наприклад, правку стилів окремо від нової функції.

## Основні операції
- Вгору: `add` (в індекс), `commit` (в історію), `push` (у віддалений).
- Вниз: `pull` (забрати й влити), `fetch` (лише завантажити), `merge` (об’єднати гілки).
- `switch` і `restore` замінили багатофункціональний `checkout`.

## Встановлення й налаштування
- На Windows став Git разом із Git Bash: це Unix-подібний термінал, команди як на macOS і Linux. Шляхи: `/` у macOS і Linux, `\` у Windows.
- Термінал важливий: на серверах і в корпоративних мережах веб-інтерфейсу GitHub може не бути.

```bash
git --version                         # перевірити встановлення
git config --global user.name "Ім’я"  # ім’я автора комітів
git config --global user.email "a@b.c" # email автора
git config --list                     # перевірити налаштування
```

## Практика
```bash
git init -b main                      # створити репозиторій з гілкою main
touch index.html                      # створити порожній файл
git status                            # файл буде untracked
git add .                             # підготувати всі зміни
git commit -m "Додавання першого ДЗ"  # зафіксувати
git log --oneline                     # коротка історія
git remote add origin URL             # зв’язати з GitHub
git remote -v                         # перевірити зв’язок
git push -u origin main               # надіслати, запам’ятати зв’язок
```
- Повідомлення коміту має казати, що саме змінилося: додав, оновив, виправив.
- Завжди перевіряй, в якій теці ти перебуваєш: типова помилка новачка — Git «не знаходить репозиторій».
- Пушити просто в main — погана практика, тому наступна лекція про гілки.
- GitHub під час push може попросити вхід. Пароль по HTTPS не приймається: потрібен вхід через браузер, токен або SSH.

> Пояснення: .gitignore лекторка створила для системного файлу macOS (найімовірніше, .DS_Store). Це приклад файлу, який не потрібен в історії.

# Лекція 03. Гілки та pull request
## Повторення: fast-forward
- Лекторка правила файл просто на GitHub. Локально зміна сама не з’явилася.
- `git pull` забрав її й оновив файл способом fast-forward: вказівник гілки зсунувся без коміту злиття.
- Це працює, якщо в локальній гілці немає власних комітів. Якщо вони є і там, і там, знадобиться злиття (тема наступної лекції).

## Що таке гілка
- Гілка потрібна, щоб працювати над завданням, не ламаючи основну версію.
- До моменту розгалуження в гілок спільна історія, потім у кожної свої коміти.
- Створення гілки не копіює теку. Працюєш в тій самій теці, а нові коміти йдуть у нову гілку.

## Практика з гілкою
```bash
git branch                            # список гілок, активна зі зірочкою
git branch homework-01                # створити, але не перемикатися
git switch homework-01                # перемкнутися
git switch -c homework-01             # створити й перемкнутися одразу
git add .                             # після правок
git commit -m "Додавання style.css"   # коміт у гілці
git switch main                       # style.css зникне з теки
git log --oneline --graph --all       # історія всіх гілок графом
```
> Пояснення: файл не видалився. Git підміняє робочу теку станом обраної гілки. Тому перед перемиканням потрібно робити коміт.

## Pull request і code review
- Публікація гілки: `git push -u origin homework-01`. GitHub сам запропонує створити pull request.
- Pull request — це запит на включення змін з однієї гілки (вихідної) в іншу (цільову, у нас main).
- Створення PR нічого не зливає, злиття лише після підтвердження.
- Вкладки: Conversation (обговорення), Commits, Files changed (порівняння, нове підсвічене зеленим).
- У вкладці Files changed можна залишити коментар до рядка. Це і є code review.

## Способи злиття на GitHub
- **Create a merge commit:** зберігає історію й додає коміт злиття. Його використала лекторка.
- **Squash and merge:** усі коміти гілки стискаються в один.
- **Rebase and merge:** коміти переносяться поверх цільової гілки без коміту злиття.

## Після злиття
- Злиття відбулося лише на GitHub: локальний main ще старий.
- Потрібно `git switch main` і `git pull` (знову fast-forward).
- Непотрібну гілку видаляють: `git branch -d homework-01`. Прапорець `-d` безпечний: Git відмовить, якщо гілку не влито.

> Пояснення: результат роботи лишається в історії main. `-D` видаляє примусово, з ним обережніше. Гілку на GitHub видаляють кнопкою після злиття або `git push origin --delete ім’я`.

# Інструкція: повний цикл
```bash
git switch main                       # 1. на основну гілку
git pull                              #    з актуальним станом
git switch -c homework-01             # 2. нова гілка
git status                            # 3. що змінилося
git add .                             #    підготувати
git commit -m "Що зробив"             #    зафіксувати
git push -u origin homework-01        # 4. надіслати гілку
```
- На GitHub: створити pull request, пройти review, обрати спосіб злиття, підтвердити.
```bash
git switch main                       # 5. повернутися
git pull                              #    забрати результат
git branch -d homework-01             # 6. видалити гілку
```
## Типові помилки
- Робота в main замість гілки: перевір `git branch`.
- Перемкнувся без коміту, і «зникли» файли: повернись і закоміть.
- Забув `git pull` на main після злиття: локально нових файлів немає.
- `git branch -d` відмовляє: гілку не влито, перевір PR.
- `not a git repository`: ти не в теці репозиторію.
- `remote origin already exists`: дивись `git remote -v`.

# Лекція 04. Конфлікти в Git, HTML і CSS
## Головне за хвилину
- Кожне завдання починай з оновлення `main` і з окремої гілки.
- Конфлікт — природний наслідок паралельної роботи, а не помилка розробника.
- Розв’язати конфлікт означає свідомо узгодити зміни, а не просто стерти маркери.
- Після злиття: `pull` на `main`, потім видалити гілки локально й на GitHub.
- HTML описує структуру сторінки, CSS — її вигляд. Це окремі речі.

## Базовий workflow у 8 кроків
1. Перейти в локальний репозиторій і виконати `git status`: незакомічених змін немає.
2. `git switch main` і `git pull`: оновити основну гілку. Саме цей крок найчастіше пропускають.
3. Створити окрему гілку для завдання (`git switch -c homework-02`).
4. Змінити або додати файли, потім `git status` і `git diff`, щоб перевірити, що змінилося.
5. `git add .`, перевірка, `git commit -m "змістовне повідомлення"`.
6. `git push -u origin homework-02`: опублікувати гілку. Це ще не потрапляння в `main`.
7. Створити pull request, переглянути зміни, перевірити можливість злиття.
8. Злити гілку в `main` й повернутися до кроку 1 для нового завдання.

> Пояснення: якщо створити гілку від застарілого `main`, у ній не буде чужих змін чи ваших власних, уже злитих. Це одна з головних причин конфліктів.

## Як виникає конфлікт
- Git не може автоматично об’єднати зміни, якщо вони суперечать одна одній: дві гілки змінили **ті самі рядки** одного файлу, або в одній гілці файл видалено, а в іншій змінено.
- Лекторка змоделювала це так: від `main` створено `homework-01` і `homework-02`, в обидві додано різні заголовки h2 в `index.html`.
- Pull request для першої гілки злився без проблем. Для другої GitHub показав, що автоматичне злиття неможливе, і запропонував розв’язати конфлікт.

## Розв’язання конфлікту на GitHub
1. Відкрити веб-редактор конфліктного файлу.
2. Побачити **маркери конфлікту**: вони розділяють суперечливі версії.
3. Визначити остаточний вміст: можна залишити одну версію, обидві або переписати. У прикладі лекторка залишила обидва заголовки.
4. **Видалити маркери**, позначити конфлікт як розв’язаний і створити коміт.
5. Завершити злиття pull request.

> Пояснення: розв’язання конфлікту не зводиться до видалення маркерів. Після нього потрібно перевірити, що проєкт працює.

## Після злиття: синхронізація й очищення
```bash
git switch main                       # перейти на main
git pull                              # забрати результат злиття
git branch -a                         # усі гілки: локальні й віддалені
git branch -d homework-01             # безпечно видалити локально
git push origin --delete homework-01  # видалити на GitHub
git fetch --prune                     # прибрати застарілі посилання на віддалені гілки
git branch -D homework-02             # примусове видалення: лише якщо розумієш наслідки
```
- Непотрібні гілки краще видаляти, щоб не було плутанини.
- `-D` видаляє навіть незлиту гілку, тож можна втратити зміни.

> Пояснення: у субтитрах очищення посилань названо загально. Тут показано `git fetch --prune`: звичайний спосіб це зробити.

## Правила роботи з Git
- Починай нове завдання з актуального `main`.
- Одне завдання, одна гілка.
- Не змішуй незалежні зміни в одному коміті.
- Регулярно синхронізуй робочу гілку з `main`, щоб виявляти конфлікти раніше.
- Перевіряй зміни перед комітом (`git status`, `git diff`), бо `git add .` може захопити зайве.
- Пиши змістовні повідомлення: історія комітів — це документація проєкту. «update» не підходить.
- Перед злиттям перевір, що проєкт працює.
- Не використовуй примусові команди без розуміння наслідків, особливо переписування спільної історії.
- Після завершення завдання створюй pull request: `push` лише публікує зміни, а PR організовує їх перевірку й злиття.

## HTML і CSS (огляд презентацій і відео)
**HTML** — мова розмітки, а не програмування: визначає структуру й зміст сторінки.
- Елемент = початковий тег, вміст, кінцевий тег. Атрибути уточнюють властивості елемента.
- Структура: службова частина `head` з метаданими і `body` з основним вмістом. Елементи вкладаються один в інший ієрархічно.
- **DOM** не дорівнює HTML-файлу: HTML — розмітка, DOM — її об’єктне подання в браузері.
- Семантика: заголовки h1–h6 будують ієрархію документа. h1 на сторінці має бути один.
- Списки: `ul` (маркований, порядок неважливий) і `ol` (нумерований, порядок важливий).
- `id` унікальний для елемента, `class` застосовується до багатьох. Це важливо для CSS-селекторів.
- `div` — універсальний контейнер для групування блоків, сам по собі змісту не має.

**CSS** розділяє структуру й оформлення.
- Три способи підключення: атрибут `style`, елемент `style` в `head`, зовнішній файл. На курсі основний — **файл**: стилі керуються централізовано й використовуються повторно.
- Правило: **селектор** + оголошення `властивість: значення` у фігурних дужках.
- Види селекторів: базові, комбінатори, псевдокласи й псевдоелементи, групування.
- **Box model:** вміст, `padding` (всередині), `border`, `margin` (зовні). Плутанина між padding і margin — частка причин проблем із розташуванням блоків.
- **Каскад і специфічність:** не завжди перемагає останнє правило. Селектор класу сильніший за селектор елемента.
- **Flexbox** (одновимірний: рядок або стовпець, для меню й карток) і **Grid** (двовимірний: рядки й стовпці, для каркаса сторінки).

# Лекція 05. JavaScript: мова, середовище виконання, система типів
## Головне за хвилину
- JavaScript — високорівнева, динамічно типізована мова, що підтримує кілька парадигм.
- Стандарт називається ECMAScript. JavaScript — мова за цим стандартом, а код виконує рушій у середовищі виконання.
- Один синтаксис, різні середовища: у браузері є `document`, у Node.js його немає.
- Тип даних пов’язаний зі значенням, а не зі змінною.
- За замовчуванням використовуй `const`, `let` лише коли значення треба змінювати, `var` лише в старому коді.
- Є 7 примітивних типів, а все інше — об’єкти (масиви, функції, Date, Map, Set).

## Що таке JavaScript
- **Високорівнева** мова: працюєш зі змінними, функціями, об’єктами, а не керуєш пам’яттю вручну. Пам’ять керується автоматично, є **збирання сміття**.
- **Динамічна типізація:** тип визначається під час виконання й пов’язується зі значенням. Одна змінна послідовно зберігає число, рядок, логічне значення.
- **Мультипарадигмова:** імперативний, об’єктно-орієнтований і функціональний підходи. Функції — повноцінні значення.
- Створювалася для інтерактивності веб-сторінок, а нині це також сервери, автоматизація, інструменти командного рядка, настільні й мобільні застосунки.

**Де застосовується:**
- клієнтські застосунки (Gmail, Google Maps, освітні платформи);
- серверні застосунки: запити, бізнес-логіка, бази даних, API (Express.js);
- автоматизація: тестування, обробка даних, звіти (Playwright);
- інструменти командного рядка (npm);
- настільні застосунки (Electron: Discord).

## Стандарт, мова, рушій
Потрібно розрізняти три поняття:
1. **ECMAScript** — стандарт: синтаксис, типи, оператори, функції, правила виконання. Його розвиває технічний комітет TC39.
2. **JavaScript** — мова, реалізована за цим стандартом.
3. **Рушій** — програмний компонент, що виконує код: V8 (Chrome), SpiderMonkey (Firefox), JavaScriptCore (Safari).

> Пояснення: стандарт не описує браузерні можливості: DOM, події, мережеві запити. Їх дає **середовище виконання**, тож мова й середовище — не одне й те саме. У субтитрах назви рушіїв перекручено, тут наведено загальновідомі.

## Як виконується код
1. Рушій розбирає код (**parsing**), перевіряє синтаксис і будує абстрактне синтаксичне дерево (AST).
2. Далі код компілюється та виконується, частини можуть додатково оптимізуватися.
3. Результат: виведення, зміна стану об’єктів, взаємодія із середовищем.

- **Інтерпретація:** виконання інструкцій без створення окремого виконуваного файлу. **Компіляція:** перетворення в машинний код або байт-код.
- Сучасні рушії поєднують обидва підходи під час виконання, тож твердження «JavaScript лише інтерпретується» неточне.

## Де виконувати код
- **Браузер:** панель розробника, консоль. Дає доступ до `document`, подій, мережі. Об’єкт `document` не входить до ядра мови, його надає браузер.
- **Node.js:** виконання поза браузером на рушії V8. Сервери, файли, мережа. Немає `document`.

```javascript
console.log("Hello, JavaScript!");              // вивести в консоль
document.body.style.backgroundColor = "lightblue"; // змінити колір фону (лише в браузері)
```

**Підключення до HTML:**
```html
<script src="script.js" defer></scr_ipt>
```
- Код у самому HTML-файлі — погана практика, у реальних проєктах його виносять у окремий файл.
- Атрибут `defer`: файл завантажується паралельно з обробкою документа, а виконується після завершення розбору, зі збереженням порядку.
- Тег зазвичай розміщують у `head`.

## Змінні
**Змінна** — іменована прив’язка, що дає доступ до значення в межах області видимості. Її ім’я називають ідентифікатором.

Три різні операції:
- **оголошення** — ввести ідентифікатор в область видимості;
- **ініціалізація** — задати початкове значення;
- **присвоєння** — встановити нове значення (може бути багаторазовим).

```javascript
let data = 100;      // число (number)
data = "текст";      // тепер рядок (string)
data = true;         // тепер логічне значення (boolean)
```
Змінна та сама, змінюються значення й тип.

## let, const, var
```javascript
let count = 0;
count = 5;               // можна: повторне присвоєння
const pi = 3.14;
pi = 3;                  // TypeError: присвоєння const
const user = { name: "Anna" };
user.name = "Maria";     // можна: змінюється вміст об’єкта
```
- **`let`:** значення змінюється, **блокова** область видимості, повторне оголошення в тій самій області заборонене.
- **`const`:** повторне присвоєння заборонене (помилка `TypeError`), початкове значення обов’язкове (інакше `SyntaxError`). Обмежує прив’язку, а не вміст об’єкта. `Object.freeze` дає лише поверхове обмеження.
- **`var`:** старий спосіб, **функціональна** область видимості, повторне оголошення дозволене. Зустрічається в старому коді, у нових проєктах не рекомендований.

> Пояснення: блок, тобто фігурні дужки, умова чи цикл, створює область видимості для `let` і `const`, але не для `var`. Через це `var` залишається доступним там, де цього не планували. У модулях змінні верхнього рівня не стають глобальними.

## Підняття, мертва зона й помилки
- **Підняття оголошень** — умовний термін: перед виконанням середовище створює прив’язки. Код фізично не переміщується.
- Для `let` і `const` прив’язка існує, але до ініціалізації недоступна. Цей період називають **тимчасовою мертвою зоною**. Звернення до змінної в ній дає `ReferenceError`.
- Для `var` змінна створюється одразу зі значенням `undefined`.
- Помилки: `ReferenceError` (змінна недоступна чи не оголошена), `TypeError` (операція неможлива для значення), `SyntaxError` (помилка синтаксису, виявляється до виконання).

## Що вибирати
- За замовчуванням `const`: це фіксує намір не змінювати прив’язку.
- `let`, коли алгоритм справді змінює значення.
- `var` лише для підтримки старого коду.
- Вибір не залежить від типу даних, відмінність лише в присвоєнні й правилах ініціалізації.

## Типи даних
**Примітивні (незмінні):**
- `string` — рядок, у одинарних, подвійних чи зворотних лапках. Послідовність кодових одиниць UTF-16, тому довжина не завжди збігається з видимими символами.
- `number` — 64-бітне число з рухомою комою. Цілі точно лише в безпечному діапазоні. Спеціальні значення: `NaN`, `Infinity`.
- `bigint` — цілі довільної точності. Безпосередньо з `number` в арифметиці не змішуються.
- `boolean` — `true` або `false`.
- `undefined` — значення, яке отримує `let` без ініціалізації. Не те саме, що неоголошена змінна.
- `null` — явна відсутність значення.
- `symbol` — унікальні значення, зокрема ключі властивостей.

**Об’єктні:** звичайні об’єкти (властивості «ключ: значення»), масиви, функції (об’єкти з можливістю виклику), `Date`, `RegExp`, колекції `Map` і `Set`.

Цей розділ мій, його немає в субтитрах. Тут те, що лекторка лише згадала або пропустила, але що знадобиться на практиці.

## Вхід на GitHub під час push
Пароль від акаунта по HTTPS **не приймається**. Є три робочі способи:
- **Вхід через браузер** (Git Credential Manager, входить у Git for Windows): під час першого `git push` відкривається вікно авторизації.
- **Персональний токен доступу (Personal Access Token):** створюється в налаштуваннях GitHub і вводиться замість пароля.
- **SSH-ключ:** найзручніший надовго, адреса репозиторію має вигляд `git@github.com:логін/репозиторій.git`.

```bash
ssh-keygen -t ed25519 -C "a@b.c"      # створити ключ (відповідай Enter на запитання)
ssh -T git@github.com                 # перевірити, що GitHub вас впізнає
```
Публічну частину ключа (файл із `.pub`) додають у налаштуваннях GitHub у розділі SSH keys.

## Як забрати наявний проєкт: git clone
```bash
git clone URL                         # копія репозиторію разом з усією історією
cd назва-проєкту                      # перейти в створену теку
```
`clone` створює теку, завантажує історію й автоматично налаштовує `origin`, тож `remote add` не потрібен.

## Як скасувати помилки
```bash
git restore файл                      # відкинути незакомічені зміни у файлі (незворотно)
git restore --staged файл             # прибрати файл з індексу, зміни лишаються
git commit --amend -m "Нове повідомлення"   # виправити останній коміт
git revert ХЕШ                        # новий коміт, що скасовує зміни зазначеного
```
- `--amend` застосовуй лише до коміту, який ще **не опубліковано** (`push`), бо він переписує історію.
- `revert` безпечний для спільної історії: він додає коміт, а не стирає старі.

> Пояснення: `git reset` теж скасовує коміти, але може втратити роботу, тому на початку краще користуватися `restore` і `revert`.

## .gitignore: що в нього вписують
```bash
node_modules/                         # залежності проєкту
.env                                  # секрети й паролі
*.log                                 # журнали
.DS_Store                             # системний файл macOS
```
- Правила діють лише на **невідстежувані** файли. Якщо файл уже закомічено, його треба прибрати з відстеження: `git rm --cached файл`.

## Merge, squash чи rebase
- **Merge commit:** зберігає всю історію гілки й додає коміт злиття. Найпростіший і найбезпечніший варіант.
- **Squash:** усі коміти гілки стають одним. Історія `main` чиста, але деталі розробки втрачаються.
- **Rebase:** коміти переносяться поверх актуального `main`, історія лінійна. Переписує коміти, тому **не застосовуй до гілок, над якими працюють інші**.

Для навчальних завдань достатньо merge commit.

# ▶ Лекція 02 · Основи Git та GitHub
# Вступ: про що лекція ✓
Добрий вечір! Тема сьогоднішнього заняття — **система контролю версій**. Без неї неможливо рухатися далі за курсом, здавати домашні завдання та розуміти, як улаштована розподілена робота.

Особливо це важливо в проєктах, де працює ціла команда. Постає кілька запитань: як отримати доступ до спільної кодової бази, як внести свої правки та як об'єднати їх із загальним проєктом.

Цю тему розділено на дві частини. Сьогодні — перша: базові команди Git. Працюватимемо в **терміналі**, бо потрібно знати команди, за допомогою яких ми керуємо Git.

# Що таке система контролю версій ✓
**Система контролю версій (СКВ)** — потужний інструмент для відстеження, збереження та керування змінами у файлах проєкту протягом його життєвого циклу.

Вона забезпечує:
- ведення історії версій;
- ідентифікацію авторів змін;
- порівняння та відновлення попередніх станів;
- паралельну розробку та об'єднання змін.

СКВ застосовують насамперед для вихідного коду, але також для файлів конфігурації, технічної документації та будь-яких інших ресурсів проєкту.

## Основні можливості
- **Збереження історії:** фіксація послідовних станів проєкту з можливістю перегляду, порівняння та відновлення попередніх версій.
- **Командна робота:** кілька розробників одночасно працюють над спільним проєктом, а внесені зміни можна узгоджувати й об'єднувати.
- **Паралельна розробка:** у гілках виконують окремі завдання незалежно — нові функції чи виправлення помилок.
- **Виявлення конфліктів:** коли різні розробники вносять несумісні зміни, СКВ дає механізми, щоб їх узгодити.
- **Відстеження авторства:** зберігаються автор, час і призначення змін, тож історію розробки можна аналізувати.

# Три типи систем контролю версій ✓
За способом зберігання даних, розташуванням репозиторіїв і взаємодією розробників СКВ поділяють на три типи: **локальні, централізовані та розподілені**.

## Локальні
Історія змін зберігається безпосередньо на комп'ютері користувача. Можна переглядати, порівнювати й відновлювати попередні версії без підключення до мережі.
- **Переваги:** простота й автономність.
- **Недоліки:** немає вбудованих механізмів синхронізації та спільної роботи.

На схемі кожна версія відображає певний стан файлу, а операція **checkout** дозволяє отримати обрану версію для подальшої роботи. Усі дії виконуються локально, без звернення до сервера.

## Централізовані
Основний репозиторій з історією проєкту лежить на **центральному сервері**, а розробники працюють із локальними робочими копіями файлів. Передача змін і керування версіями відбуваються через взаємодію із сервером.
- **Переваги:** централізоване зберігання, узгодження змін, керування доступом.
- **Недолік:** більшість операцій залежить від доступності сервера й мережі.

Одна операція передає зафіксовані зміни до центрального репозиторію, друга — отримує актуальний стан із сервера. Синхронізація відбувається через єдиний центральний репозиторій.

## Розподілені
Саме на них ми зосередимося. У кожного розробника є **власна повноцінна копія репозиторію** з файлами та всією історією. Тому основні операції виконуються автономно: фіксація змін, створення гілок, перегляд історії, відновлення попередніх станів. Репозиторії синхронізуються з віддаленими для обміну змінами між учасниками. Приклад такої системи — **Git**.

На схемі кожен розробник має локальний репозиторій з історією та робочу копію файлів:
- **commit** — локальна фіксація змін;
- **push** — передача комітів до віддаленого репозиторію;
- **pull** — отримання змін та їх інтеграція.

Така модель забезпечує автономну роботу й синхронізацію результатів через спільний репозиторій. Завдяки цьому розподілені СКВ набули широкого застосування в сучасній розробці.

# Git: принципи роботи, знімки та коміти ✓
Найпопулярнішою системою контролю версій є саме **Git**. Сьогодні розглянемо принципи його роботи, а потім перейдемо до архітектури: коли говоритимемо про архітектуру, ми вже застосовуватимемо розуміння принципів.

**Git** — розподілена система контролю версій. Вона призначена для відстеження змін у файлах проєкту, організації спільної роботи, збереження історії та розвитку проєкту.

## Модель знімків
В основі Git лежить **модель знімків (snapshots)**: Git фіксує стан проєкту на певний момент часу. Знімок — це подання стану файлів і каталогів проєкту, підготовлених для збереження в історії. Кожен знімок дозволяє відтворити відповідний стан проєкту незалежно від подальших змін.

Щоб оптимізувати використання сховища, Git повторно використовує раніше збережені об’єкти. Якщо вміст файлу не змінився, новий об’єкт не створюється, натомість знімок **посилається на вже збережений**. Тож формування нового знімка не потребує дублювання всіх файлів проєкту.

**Приклад зі схеми (три знімки):**
1. Початковий стан: три файли — `index.html`, `style.css`, `script.js`.
2. Змінився лише `index.html`, тож у знімок 2 потрапляє його нова версія, а `style.css` і `script.js` — це посилання на ті самі файли, що й раніше.
3. Знову змінився `index.html`, тож зберігається ще одна його версія, а `style.css` лишається посиланням на той самий файл.

> Пояснення: це спрощена логіка, але вона добре показує головну ідею: Git зберігає не «різниці», а стани проєкту, і не дублює те, що не змінилося.

## Коміт
Щоб зберегти знімок в історії, Git створює **коміт** — запис, що фіксує певний стан проєкту. Кожен коміт містить:
- посилання на дерево файлів відповідного стану;
- інформацію про автора;
- дату створення;
- повідомлення з описом змін;
- посилання на батьківський коміт.

## Адресація за вмістом
Для зберігання даних Git використовує **адресацію за вмістом**: об’єкти ідентифікуються за криптографічними хешами. Це дає змогу встановлювати зв’язки між збереженими даними та перевіряти їхню цілісність.

Послідовність взаємопов’язаних комітів формує **історію розвитку проєкту**. Ми побачимо її, коли створюватимемо віддалений і локальний репозиторії. Завдяки цьому Git дозволяє порівнювати версії, аналізувати внесені зміни та за потреби відновлювати попередні стани.

Архітектура Git передбачає розподіл процесів: редагування файлів, підготовка змін, збереження історії та синхронізація між розробниками. Залежно від розташування даних і характеру операцій розрізняють **локальне** та **віддалене** середовище.

# Архітектура Git: локальне й віддалене середовище ✓
## Локальне середовище
Охоплює компоненти Git, розташовані на комп’ютері розробника. Воно забезпечує виконання основних операцій керування версіями **без постійного підключення до мережі**. До його складу входять три компоненти.

**1. Робочий каталог (working directory).** Частина файлової системи, де лежать файли поточної версії проєкту. Саме тут ми створюємо, редагуємо та видаляємо файли за допомогою середовища розробки чи редактора коду. Зміни, внесені в робочий каталог, **не потрапляють до історії автоматично**: для їх фіксації потрібно виконати спеціальні операції.

**2. Область індексації (staging area).** Проміжна структура Git для підготовки вмісту наступного коміту. Вона дає змогу визначити, які саме зміни включити до чергової версії проєкту, і формувати логічно завершені коміти без необхідності фіксувати всі зміни робочого каталогу одразу.

**3. Локальний репозиторій.** Сховище Git на комп’ютері розробника: об’єкти системи контролю версій, історія комітів, посилання на гілки та службова інформація. Зазвичай ці дані лежать у **прихованому каталозі `.git`** в корені проєкту (ми побачимо це на практиці).

Повноцінний локальний репозиторій дозволяє незалежно від віддаленого сервера фіксувати зміни, переглядати історію, створювати гілки та повертатися до попередніх станів проєкту.

## Віддалене середовище
**Віддалений репозиторій** — це репозиторій Git, доступний через мережу й призначений для обміну змінами між розробниками. Він може розміщуватися на власному сервері організації або на спеціалізованій платформі, як-от **GitHub** чи GitLab. Він забезпечує спільний доступ до історії проєкту, синхронізацію комітів та організацію командної розробки.

**Важливо:** віддалений репозиторій **не є обов’язковою умовою** використання Git. Можна створити лише локальний репозиторій і працювати з ним тими самими командами: зберігати історію комітів і повертатися до попередньої робочої версії, якщо щось пішло не так. Віддалений репозиторій потрібен для обміну кодом з іншими розробниками, тобто для **спільної роботи**.

Сьогодні ми знайомимося з базовими операціями. Практичніші випадки, які трапляються в повсякденній розробці, зокрема конфлікти та способи їх уникнути, розберемо на наступному занятті (у вівторок).

# Основні операції та команди ✓
Робота з Git — це переміщення й синхронізація даних між компонентами локального та віддаленого середовища. Залежно від призначення операції поділяють на два потоки:
- **висхідний потік** — підготовка й публікація змін;
- **низхідний потік** — отримання оновлень і робота з історією.

## Висхідний потік
Показує послідовність від редагування файлів у робочому каталозі до передачі зафіксованих змін у віддалений репозиторій.
- **`git add`** — підготовка змін: додає вибрані файли з робочого каталогу до області індексації й формує набір змін для наступного коміту.
- **`git commit`** — фіксація змін у локальному репозиторії: створює коміт на основі підготовленого стану, зберігає знімок і метадані.
- **`git push`** — передавання змін до віддаленого репозиторію: передає потрібні локальні об’єкти й оновлює відповідні посилання, тобто публікує результати роботи.

Тож спочатку ми формуємо зміни локально, фіксуємо їх у вигляді комітів і лише потім передаємо у віддалений репозиторій.

## Низхідний потік
Охоплює отримання змін із віддаленого репозиторію та їх інтеграцію в локальну історію.
- **`git pull`** — отримує зміни з віддаленого репозиторію й інтегрує їх у поточну локальну гілку шляхом злиття (merge) або перебазування (rebase), залежно від налаштувань.
- **`git fetch`** — завантажує нові коміти й оновлює відомості про віддалені гілки, але **без автоматичного включення** змін до поточної гілки. Докладніше про це на наступному занятті.
- **`git checkout`** — перемикання між гілками та відновлення файлів: дає змогу перейти до іншої гілки чи вибраного коміту й оновлює стан робочого каталогу. У сучасних версіях Git для цього є окремі команди **`git switch`** і **`git restore`**, які чітко розділяють ці операції.
- **`git merge`** — об’єднання змін з різних гілок: інтегрує зміни зазначеної гілки в поточну, тобто об’єднує результати паралельної розробки.

## Що важливо пам’ятати
- Це лише базові команди. У роботі з віддаленим репозиторієм (наприклад, GitHub) є багато тонкощів і нюансів, тому ми розглядатимемо випадки від простих до складних.
- **`git status`** використовується дуже часто, ми користуватимемося ним постійно.
- Для кожної команди є багато додаткових параметрів, які дають змогу отримати додаткову інформацію або виконати уточнені дії. Усе запам’ятати неможливо, тому потрібно вчитися працювати з **документацією**.
- **Домашня робота:** вдома уважно опрацювати кілька розділів офіційної документації Git: вона містить усі команди з поясненнями та прикладами. Лекторка покаже цю документацію пізніше.

# Встановлення й налаштування Git ✓
Перед початком роботи Git потрібно **встановити** і виконати **початкові налаштування**. Показувати встановлення лекторка не буде: це проста операція, і Git у неї вже встановлено. Посилання на офіційний сайт і документацію є в презентації.

## Яку версію встановлювати
На офіційному сайті для кожної операційної системи є свій пакет для інсталяції.
- **Windows:** потрібен офіційний пакет **Git for Windows**. До його складу входить **Git Bash** — термінал, що надає Unix-подібне командне середовище у Windows. Лекторка радить працювати саме в ньому.
- **macOS:** окремий пакет не потрібен, працюємо у вбудованому терміналі.

## Чому термінал, а не лише GitHub
Користуватися веб-інтерфейсом GitHub дуже просто, але в професійній розробці доступ до нього не завжди є або не завжди потрібен. Розробники можуть працювати на віддалених серверах без графічного інтерфейсу або в корпоративних мережах з обмеженим доступом. Знання команд Git дає змогу незалежно від графічних інструментів:
- отримувати зміни та аналізувати історію комітів;
- порівнювати версії файлів і працювати з гілками;
- синхронізувати локальний і віддалений репозиторії.

## Чому саме Git Bash у Windows
Він підтримує ті самі команди, що й macOS та Linux. Тож усе, що показує лекторка, можна повторювати **у точності як вона пише**. У звичайному терміналі Windows різниця між командами може бути значною.

## Перша дія: перевірити встановлення
```bash
git --version                         # покаже номер версії (у лекторки 2.51)
```
Якщо Git не встановлено або команда недоступна, виконай інсталяцію й перевір ще раз.

## Налаштування автора
Конфігурація Git передбачає параметри, що використовуються під час створення комітів: **ім’я та email автора**.
```bash
git config --global user.name "Ім’я"
git config --global user.email "a@b.c"
git config --list                     # переконатися, що налаштування застосувалися
```
> Це обов’язково перевіряти, бо ці дані потрапляють у кожен коміт.

## Документація
Вступ і основи Git в офіційній документації — **домашнє завдання**: розділи добре структуровані, з ілюстраціями та прикладами й дають максимальне розуміння роботи з Git.

# Створення віддаленого репозиторію на GitHub ✓
Спочатку створимо **віддалений репозиторій**. З Git можна працювати й через консоль, але зараз просто зареєструємося та авторизуємося на сайті, а потім натиснемо кнопку створення репозиторію.

**Що вказати:**
1. **Назву** репозиторію (у лекторки `js-fundamentals`) та за бажанням **опис** (description).
2. Залишити репозиторій **публічним (Public)**.
3. **Не** додавати README, `.gitignore` і ліцензію: їх, за потреби, додамо потім командами.

## Чому публічний
Публічний репозиторій можуть переглядати всі, у кого є посилання, але вносити зміни можуть лише користувачі з відповідними правами. Для нашої роботи це зручно:
- зручно писати зворотний зв’язок (фідбеки);
- можна зазирати одне одному в репозиторії та бачити, як інші розв’язують домашні завдання.

## Що після створення
Після створення відкриється перша сторінка порожнього репозиторію. На ній є **посилання на репозиторій**: його треба скопіювати, воно знадобиться, коли будемо прив’язувати локальний репозиторій до віддаленого.

# Створення локального репозиторію ✓
**Локальний репозиторій** розташований на нашому комп’ютері й зберігає історію змін та забезпечує контроль версій незалежно від постійного підключення до GitHub. Працюємо в терміналі.

## Шляхи в різних системах
- macOS і Linux: каталоги розділяє прямий слеш `/`, абсолютні шляхи починаються з кореня `/`.
- Windows: зазвичай зворотний слеш `\`, абсолютні шляхи починаються з літери диска, наприклад `C:\`.

У Git Bash у Windows проблем із написанням і використанням базових команд буде менше.

## Створюємо теку й ініціалізуємо репозиторій
```bash
cd Downloads                          # перейти до теки, де буде проєкт (у вас може бути інша)
mkdir js-fundamentals                 # створити теку з назвою курсу
cd js-fundamentals                    # перейти в неї
git init -b main                      # ініціалізувати репозиторій
```
- `git init` створює новий локальний репозиторій у поточній теці й формує прихований службовий каталог **`.git`**: там зберігаються об’єкти, історія комітів, посилання на гілки та конфігураційні файли.
- Прапорець `-b main` задає назву початкової гілки: **main**.
- Підтвердження: повідомлення в терміналі та видима прихована тека `.git`.

## Тека для першого домашнього завдання
Домашні завдання зберігатимемо прямо в репозиторії й передаватимемо на GitHub, щоб лекторка могла перевірити їх і написати фідбеки. Для першого створимо окрему теку з номером і підкресленням (наприклад, `01_...`).

> **Завжди контролюй, де ти перебуваєш.** Типова помилка новачка: Git каже «репозиторій не знайдено», бо команду виконано не в теці репозиторію.

## Створюємо файл `index.html`
```bash
cd 01_...                             # перейти в теку завдання
touch index.html                      # створити порожній файл
```
- `touch` створює порожній файл із вказаною назвою.
- У VS Code краще відкривати **цілу теку** (Open Folder), а не один файл.
- Заготовка HTML: у порожньому файлі набрати `!` і натиснути **Tab** (Emmet) — з’явиться базова структура документа. Збережи файл.

## Перевіряємо стан
Повертаємося в **корінь репозиторію** (`js-fundamentals`) і перед будь-якими командами Git виконуємо:
```bash
git status                            # поточний стан робочого каталогу й індексу
```
Команда показує нові, змінені та підготовлені файли. Файл `index.html` і тека, що його містить, створені після ініціалізації, тому Git визначає їх як **untracked** (невідстежувані).

## Файл `.gitignore`
Лекторка також створює `.gitignore`: у ній з’явилася внутрішня тека, яку створила сама система (найімовірніше, `.DS_Store` на macOS). Такі файли Git відстежувати не потрібно, тому їх вписують у `.gitignore`.
- `.gitignore` — прихований файл. Відкрити його з терміналу можна, вказавши програму й назву файлу (на macOS це `open -a "Visual Studio Code" .gitignore`).
- У файл додаємо рядок `.DS_Store` (регістр важливий), зберігаємо зміни.
- Знову `git status`: тепер у списку є і `.gitignore`.

Тепер файли мають статус, і їх можна додавати до **області індексації** перед фіксацією змін.

# Підготовка і фіксація змін: add і commit ✓
## `git add` — підготовка файлів
Щоб підготувати файли до включення в коміт, використовуємо **`git add`**. Можна перелічити файли поштучно (у лекторки це `index.html` у теці завдання), а потім перевірити `git status`: файл уже підготовлений.

Якщо файлів багато, є зручні варіанти:
- **`git add .`** — підготувати всі невідстежувані й змінені файли в поточній теці;
- **`git add -A`** — підготувати всі зміни **в межах усього репозиторію**, незалежно від поточного каталогу.

> Пояснення: у субтитрах ця команда з прапорцем розпізнана погано. Найімовірніше, лекторка мала на увазі `-A` (скорочення від `--all`).

## `git commit` — фіксація
**Коміт** — це зафіксований стан проєкту, що зберігається в історії Git разом із метаданими: автором, датою створення та повідомленням. Повідомлення **обов’язково мають бути змістовними** й вказувати, що саме відбулося: додавання, оновлення, виправлення.

```bash
git commit -m "Додавання першого домашнього завдання"
```
- `-m` (message) дає змогу вказати повідомлення прямо в команді, **без відкриття текстового редактора**. Без `-m` відкриється текстове вікно, де повідомлення пишуть уже в ньому.
- Коміт створюється в **локальному** репозиторії та містить підготовлені файли.

## `git log --oneline` — історія
```bash
git log --oneline                     # скорочена історія: один коміт на рядок
```
Команда `git log` показує історію комітів з їхніми **ідентифікаторами**; вони знадобляться, коли ми розглядатимемо випадки доступу до конкретного коміту. Прапорець `--oneline` лише скорочує виведення. Вдома можна спробувати різні параметри й подивитися результат.

# Підключення до GitHub і push ✓
Тепер у нас два **незалежні** репозиторії: локальний (уже з комітом) і віддалений. Щоб їх зв’язати, використовуємо `git remote`.

```bash
git remote add origin URL             # додати зв’язок з віддаленим репозиторієм
git remote -v                         # перевірити, що зв’язок з’явився
```
- **`origin`** — умовна назва віддаленого репозиторію (за замовчуванням).
- **URL** — адреса репозиторію на GitHub; її видно на першій сторінці репозиторію.
- `git remote add` нічого помітного не виводить. Перевірити результат можна через `-v`: побачимо адреси для **fetch** і **push**.

## `git push`
**`git push`** передає локальні коміти у віддалений репозиторій і оновлює відповідну віддалену гілку.
```bash
git push -u origin main
```
- `origin` — куди надсилаємо (віддалений репозиторій);
- `main` — яка гілка з комітами;
- `-u` — встановлює **зв’язок між локальною та віддаленою гілкою** для подальшої синхронізації.

## Автентифікація
Під час передавання змін GitHub може **вимагати автентифікацію**. Лекторка не показала цей крок, бо вона вже авторизована, а в тих, хто працює з GitHub уперше, можуть виникнути питання. Це не складно, але **уважно читайте повідомлення системи**.

## Перевірка результату
- У терміналі видно, що передано 100 % об’єктів, адресу віддаленого репозиторію та гілку **main**.
- Оновивши сторінку репозиторію на GitHub, бачимо теку із завданням, файл `index.html` і `.gitignore`.

> **Попередження лекторки:** пушити одразу в `main` — **погана практика**. На сьогодні ми лише знайомимося з командами. На наступному занятті розберемо гілки (branches), pull request і реальні кейси роботи в проєкті. Також обіцяно розглянути **`git clone`**, бо проєкт може вже існувати.

## Що ми зробили
1. Створили локальний і віддалений репозиторії та теку.
2. Перевірили зміни через `git status`.
3. Підготували файли командою `git add`.
4. Зафіксували зміни командою `git commit`.
5. Підключили віддалений репозиторій через `git remote`.
6. Надіслали проєкт на GitHub командою `git push`.

# Редагування на GitHub і розбіжність ✓
Наприкінці лекторка додала в `index.html` заголовок **прямо на GitHub**, залишила запропоноване повідомлення коміту (або можна написати своє) й закомітила зміни. Тобто на GitHub тепер є коміт, якого немає локально.

Часу вже не вистачило, тож цю ситуацію вона не розібрала: можна вносити зміни і на GitHub, і локально, і їх потрібно синхронізувати. З цього почнемо на наступному занятті, а також побачимо, яка робота є правильною: **у `main` ніхто не пушить і ніхто не працює з ним безпосередньо, усі працюють у гілках**.

> Пояснення: у другій лекції показано, що саме `git pull` підтягне такий коміт, якщо локально нових комітів немає (fast-forward). Лекторка визнала, що `git pull` на цій лекції показати не встигла.

# Запитання і довідка (help) ✓
Під час запитань прозвучало: чим відрізняються `-m` та інші прапорці. Лекторка пояснила `-m`: без нього відкривається текстовий редактор, а з ним повідомлення вводять прямо в команді. Що робить прапорець `-u` у `git commit`, вона одразу не згадала, сказавши, що давно не користувалася.

Головна порада: **якщо не пам’ятаєш параметра, дивись довідку**. Усіх параметрів не пам’ятає навіть лекторка, а користуються тими, що найчастіше. Довідка допомагає швидко розібратися та пригадати забуте.

> Пояснення (від мене): довідка викликається через `git help команда`, `git команда --help` або коротко `git команда -h` (лише список параметрів).

Найнадійніше джерело інформації — **офіційна документація Git** (посилання в презентації). Наступне заняття присвячене розбору практичних випадків: гілки, pull request, конфлікти. Тема дуже велика, тому її розбито на дві лекції.

# ▶ Лекція 03 · Git і GitHub, частина 2
# Повторення і git pull (fast-forward) ✓
Тема Git і GitHub надважлива: це основа командної роботи в будь-яких проєктах. Домашнє завдання здаватимемо через GitHub, тому потрібно розуміти механізми взаємодії локального й віддаленого репозиторіїв. Наприкінці заняття буде домашнє завдання з частиною для самостійного опрацювання: вона не складна, а запитання можна ставити лекторці.

## Що було на минулому занятті
- Створили локальний репозиторій і виконали налаштування (вони описані в презентації).
- Зробили теку для першого домашнього завдання: протягом кількох занять працюватимемо саме з нею.
- Створили віддалений репозиторій і синхронізували обидва.

## Зміни можуть з’являтися і у віддаленому репозиторії
У команді інші учасники можуть редагувати файли, створювати коміти й оновлювати віддалений репозиторій. Ці зміни **не потрапляють у локальний репозиторій автоматично**. Щоб отримати й інтегрувати їх, використовуємо **`git pull`**.

## Демонстрація
1. На GitHub відкриваємо `index.html` і додаємо заголовок першого рівня `h1` для першого домашнього завдання.
2. Підтверджуємо зміни (коміт) з повідомленням за замовчуванням або власним. Зміни потрапили у віддалену гілку **main**.
3. Тепер на GitHub є новий коміт, а локально його немає, і файл лишається без змін.
4. У терміналі, перевіривши, що ми в теці репозиторію, виконуємо:

```bash
git pull                              # забрати коміт з GitHub і влити в локальну гілку
git status                            # перевірити стан
git log --oneline                     # побачити оновлену історію
```
Заголовок з’явився в локальному `index.html`, репозиторії синхронізовані.

## Що таке fast-forward
`git pull` у цьому випадку спрацював за механізмом **fast-forward**: вказівник гілки просто **переміщується до новішого коміту** без створення додаткового коміту злиття (merge commit). Він застосовується, коли в локальній гілці **немає власних комітів**.

- Якщо ми впевнені, що локальних комітів немає, оновитися можна безпечно й швидко однією командою.
- Докладніше про це, а також про конфлікти під час синхронізації та злиття, лекторка розповість на наступному занятті.

# Гілки (branches): що це і навіщо ✓
У командній розробці (і взагалі під час створення програмного забезпечення) часто треба **виконувати кілька завдань одночасно**, не змінюючи основну версію продукту. Особливо це стосується командної роботи, де над проєктом працює не один розробник.

Для цього в Git є механізм **гілок (branches)**. Він дає змогу організувати незалежну роботу над окремими функціональними можливостями, виправленнями та іншими змінами, що вносяться під час розробки.

# Гілка як рухомий вказівник ✓
**Гілка** — це **рухомий вказівник на певний коміт** в історії Git. Вона дає змогу формувати незалежну послідовність комітів і не змінювати історію інших гілок.

Після ініціалізації репозиторію ми створили основну гілку **main**, де зафіксовано результат першого завдання. Для наступного завдання додаватимемо файл у вже створену теку й синхронізуватимемо.

**Ілюстрація зі слайда** (принцип розгалуження історії):
- сірим позначено коміти гілки **main**, зеленим — робочої гілки (у прикладі `homework-02`);
- **до моменту розгалуження обидві гілки мають спільну історію**;
- після створення гілки розробник формує в ній нові коміти, **незалежні від main** і такі, що не змінюють основну версію;
- у main також можуть з’являтися нові коміти, тож кожна гілка має власну послідовність змін;
- після завершення роботи результат об’єднують з main, зокрема за допомогою **pull request**.

## Перевірка перед створенням гілки
```bash
git branch                            # локальні гілки; поки що лише main, і вона активна
git branch -a                         # локальні й віддалені (посилання на ті, про які вже відомо)
git status                            # переконатися, що незавершених змін немає
```
Якщо ми хочемо «успадкувати» від main, треба бути на ній, а робочий каталог не повинен містити незавершених змін.

# Створення гілки і перемикання ✓
```bash
git branch homework-01                # створити локальну гілку на основі поточного коміту
git branch                            # у списку з’явилася, але активною лишається main
git switch homework-01                # перемкнутися на неї
git branch                            # тепер активна homework-01
```
- `git branch <назва>` створює нову локальну гілку на основі поточного коміту, але **автоматично на неї не перемикає**.
- Можна зробити все **одразу одним кроком**: `git switch -c homework-01` (`-c` = create — створити та перемкнутися).
- Далі працюємо безпосередньо в цій гілці: усі зміни йтимуть у неї, а не в main.

> Пояснення: у субтитрах назва гілки звучить як «нуль-один» і «homework 0, 1». Я використовую `homework-01`, як у конспекті; назва може бути будь-якою, головне, щоб вона описувала завдання.

Лекторка також нагадала, що ті, хто вже знайомий із Git, могли чути про команду **`git checkout`**. Про неї йтиметься далі.

# checkout, switch і restore ✓
Чому ми не використовуємо `git checkout`? Сама команда **підтримує перемикання між гілками**, але її призначення значно ширше. Залежно від параметрів вона може виконувати різні операції:
- перемикатися на гілку (наприклад, `main`);
- створювати нову гілку й одразу переходити на неї (`-b`);
- переходити до конкретного коміту з відповідним станом проєкту (за його ідентифікатором);
- відновлювати файл (наприклад, `git checkout index.html`), скасовуючи незбережені зміни в робочому файлі.

Команда потужна, але саме через це особливо на початку **спричиняла плутанину**. Тому, починаючи приблизно з версії **Git 2.23**, її функціональність розділили на дві спеціалізовані команди:
- **`git switch`** — перемикання між гілками та створення нових;
- **`git restore`** — відновлення файлів і скасування змін.

## Що відбувається, коли створюєш гілку
Нова гілка (наприклад, `homework-01`), створена від `main`, **спочатку вказує на той самий коміт**. Тому в ній одразу доступні всі файли, що були в цьому коміті (у нашому випадку `index.html` у теці завдання).

Важливо:
- Git **не завантажує файли з нуля й не створює другу фізичну копію** теки проєкту. Ми й далі працюємо в тій самій локальній теці.
- Усі **нові коміти** тепер належатимуть новій гілці.
- Нова гілка містить **усю історію комітів і стан файлів** основної гілки **на момент створення**.

# Практика: файл style.css у гілці ✓
## Створення файлу й перший коміт
Лекторка створює у VS Code файл `style.css`. Оскільки ми перемкнулися на гілку, файл належить саме до її версії проєкту.

```bash
git status                            # style.css у списку untracked
git add .                             # підготувати (або конкретний файл)
git status                            # файл готовий до коміту
git commit -m "Додавання файлу style.css"
```
Після цього новий коміт належить гілці `homework-01`, а `index.html` залишився без змін.

## Гілки незалежні: наочний експеримент
```bash
git switch main                       # style.css зникає з теки
git switch homework-01                # style.css знову на місці
```
Після переходу на **main** у теці є лише `index.html`, а `style.css` відсутній, навіть якщо він відкритий у редакторі. Файл **не видалено**: він закомічений в історії гілки `homework-01`, а Git просто повертає робочу теку до стану вибраної гілки.

**Головне:**
- Створення гілки **не створює окрему теку** й не копіює файли з main. Гілка — це окремий напрямок розвитку історії комітів у межах **одного** репозиторію.
- Гілка **успадковує стан проєкту на момент розгалуження**, а далі зберігає зміни незалежно.
- Не потрібно повторно додавати файли, що вже були в main на момент створення гілки.

## Другий коміт у гілці
Повернувшись у `homework-01`, лекторка додає в `style.css` просте CSS-правило (CSS — тема наступних занять), зберігає файл і повторює цикл:
```bash
git status                            # файл змінений
git add .
git status                            # підготовлений
git commit -m "Внесення змін до файлу style.css"   # повідомлення мають відрізнятися
```
Вказівник гілки `homework-01` переміститься на новий коміт, а вказівник **main залишається на попередньому**.

## Історія з графом
```bash
git log --oneline --graph --all
```
- `--oneline` — кожен коміт одним рядком;
- `--graph` — текстове графічне подання зв’язків між комітами;
- `--all` — історія доступна через **усі** посилання: локальні гілки й посилання на віддалені, а не лише поточна гілка.

Поки що граф простий, бо розгалуження ще небагато, але далі він стане цікавішим.

> **Ще раз про незалежність:** на `main` файлу `style.css` немає, а в `homework-01` є обидва файли. Це дозволяє працювати з різними станами проєкту в межах одного репозиторію: спільні файли доступні в обох гілках, а зміни, зафіксовані в одній, не «протікають» в іншу.

# Публікація гілки та створення pull request ✓
## Надсилання гілки на GitHub
```bash
git push -u origin homework-01
```
- `origin` — віддалений репозиторій; `homework-01` — назва гілки; `-u` встановлює зв’язок між локальною та віддаленою гілкою для подальших `push` і `pull`.
- У виводі видно створення віддаленої гілки `homework-01` та повідомлення про налаштування відстеження (set up to track).
- Оновивши сторінку GitHub, бачимо **дві гілки** (`main` і `homework-01`), а також посилання, яким GitHub пропонує **створити pull request**.

## Чому pull request
Pull request — дуже важлива операція. Лекторка хоче для всіх **однаково з нуля** пояснити найпростіший варіант, а саме візуально, через інструменти GitHub. На наступному занятті, розбираючи конфлікти, повернемося до терміналу й команд.

У командній роботі різні розробники мають **власні гілки** (або гілки за функціоналом: підходи в командах різні). Але потім усі гілки в певний момент **об’єднуються в одну загальну** для фінальної версії продукту. На GitHub для цього є **pull request**, що дозволяє: запропонувати зміни, переглянути їх, обговорити (review) і лише після цього об’єднати з цільовою гілкою.

**Pull request** — запит на включення змін з однієї гілки в іншу. Він забезпечує перевірку коду, обговорення та контроль об’єднання.

## Як створити
1. Натискаємо кнопку створення pull request.
2. Обираємо **цільову** гілку, до якої пропонується включити зміни (`main`), і **вихідну**, що містить запропоновані зміни (`homework-01`). Якщо гілок багато, їх треба вибрати вручну.
3. Пишемо **заголовок** і **опис** (description), наприклад «перший pull request».
4. Створюємо PR.

На сторінці PR видно коміти (додавання файлу `style.css`, внесення змін до нього) і зміни у файлах: **нове підсвічується зеленим**. Зверху з’являється повідомлення, що гілки можна об’єднати автоматично **без конфліктів**: система перевірила це заздалегідь.

> **Створення PR не зливає гілки.** Спочатку зміни доступні для перегляду й перевірки, а об’єднання відбувається лише після підтвердження за виконання необхідних умов.

Тут же можна переглянути зміни й залишити коментарі до рядків коду: це **code review**, його лекторка покаже далі.

# Огляд pull request і code review ✓
Варто прокоментувати вкладки на сторінці pull request. Угорі відображено інформацію про запропоновані зміни, історію комітів і можливість об’єднання.

- **Conversation** — відкривається першою. Тут опис самого запиту, коментарі учасників, результати перевірок (якщо вони є) та інформація про стан об’єднання.
- **Commits** — коміти, включені до pull request: у нашому прикладі додавання файлу `style.css` і внесення змін до нього.
- **Files changed** — перегляд змін у файлах. Можна порівняти вміст вихідної та цільової гілки. У прикладі показано повний файл `style.css`.

## Code review
Саме у вкладці зі змінами в файлах відбувається **code review** — перевірка змін у вихідному коді, яку виконують інші розробники, що мають доступ до репозиторію. Мета: перевірити коректність, відповідність вимогам проєкту та стандартам розробки.

Якщо якийсь рядок не влаштовує, **коментар можна залишити прямо під ним**. Приклад лекторки: у файлі стилів обрано неправильний колір, а потрібен `dark blue`, а не `blue`. Такий коментар — повідомлення іншим учасникам команди про те, яку зміну треба внести й чому: це не відповідає вимогам проєкту.

Повернувшись до **Conversation**, бачимо залишений коментар. Інший розробник також може переглянути код і написати свій коментар. Так, обговоривши питання, команда ухвалює остаточне рішення. Коли всі спірні моменти (зокрема конфлікти, якщо вони були) вирішено, можна переходити до об’єднання.

> Пояснення: у прикладі лекторка залишила єдине зауваження як демонстрацію. У реальному проєкті автор після коментаря виправляє код і оновлює гілку, а рецензент повторно перевіряє зміни.

Внизу GitHub пропонує **три способи злиття**. Саме **злиття (merge)** — це операція інтеграції змін з однієї гілки в іншу: після неї цільова гілка містить результати роботи, внесені у вихідній.

# Способи злиття ✓
На GitHub доступні три способи об’єднання (кнопки англійською). **Які з них доступні, залежить від налаштувань репозиторію.**
1. **Create a merge commit** — зберігає історію комітів вихідної гілки та створює окремий **коміт злиття**.
2. **Squash and merge** — всі коміти гілки об’єднуються в **один новий коміт**.
3. **Rebase and merge** — коміти вихідної гілки переносяться поверх актуальної історії цільової **без створення коміту злиття**.

Перший варіант найчастіше використовують у більшості випадків, якщо він доступний: він зберігає історію комітів вихідної гілки й окремо фіксує факт об’єднання з `main`. Лекторка обирає саме його й підтверджує злиття; GitHub показує повідомлення, що воно успішне.

## Перевірка після злиття
- У гілці `main` на GitHub тепер є і `index.html`, і `style.css`: зміни об’єднано. Конфліктів не було, тому все пройшло гладко.
- **Важливо:** злиття виконано лише у **віддаленому** репозиторії. Віддалена гілка `main` вже має нові зміни, а **локальна ще в попередньому стані**. Потрібна синхронізація, щоб надалі не виникали конфлікти.

## Синхронізація локального main
```bash
git branch                            # перевірити, де ми зараз (було homework-01)
git switch main                       # перейти на main
git pull                              # забрати результат злиття
git log --oneline --graph --all       # подивитися історію графом
```
Оскільки у локальному `main` додаткових комітів не було, `git pull` спрацював за **fast-forward** швидко й легко: гілка отримала оновлення, і локальний `main` синхронізовано з віддаленим.

## Як читати граф
- Рядок із **`HEAD -> main`** — поточний коміт основної гілки (ми перебуваємо в `main`), поруч вказано стан віддаленої гілки.
- **Merge pull request** — коміт злиття, створений після прийняття PR: через нього зміни з `homework-01` потрапили в `main`.
- Також є останній коміт, який ми робили у гілці.
- Видно, як від спільної історії відокремилась робоча гілка `homework-01`, у ній створено коміти, а потім її об’єднано з `main` через pull request.

Така візуалізація корисна, щоб швидко зрозуміти, які гілки з якими об’єднували й від якої гілки що отримано. Після цих дій у локальній історії доступні коміти, отримані після об’єднання, а за використаного способу історія містить і відповідні коміти злиття.

# Видалення гілки після злиття ✓
Якщо об’єднання пройшло успішно, робоча гілка (`homework-01`) вже **не потрібна**. Чому її варто видалити:
- коли гілок багато, це створює **плутанину**;
- немає сенсу тримати зайві гілки: гілка потрібна лише на певний момент, щоб зробити окрему зміну (у нашому випадку додати файл) і об’єднати її з `main`, де вона й зберігається.

Домашнє завдання, яке ми не збираємося змінювати, не потребує збереження гілки. У будь-який момент можна знову створити гілку з поточного стану `main`. Тож гілки, які вже об’єднані з базовою (у нашому прикладі `main`), **підлягають видаленню**.

```bash
git branch -d homework-01             # безпечне видалення гілки
git branch                            # переконатися, що лишилася тільки main
```
- `-d` (або `--delete`) — **безпечне видалення**: Git перевіряє, що зміни вже інтегровано. Якщо підтвердити це не може, видалення відхиляється.
- Видалення гілки **не видаляє результатів роботи**: зміни залишаються в історії `main`.

**Якщо знадобиться щось додати чи виправити** (наприклад, новий файл `script.js`), робимо новий цикл: переконатися, що `main` не містить необроблених комітів, створити окрему гілку, виконати зміни та знову об’єднати їх з `main`.

> Пояснення: так працюють у реальних проєктах: `main` лишається стабільною, а нові завдання виконують в окремих короткоживучих гілках.

На цьому ми розглянули базовий нескладний **workflow** з основними командами Git. Найцікавіше починається тоді, коли виникають **конфлікти**. **Наступне заняття** буде присвячене їх розв’язанню: які бувають конфлікти, як їм запобігати і що робити, щоб їх розв’язати. Буде кілька кейсів, знову на нашому репозиторії.

# Домашнє завдання ✓
Воно здається великим, але **не складне** й виконується швидко: присвячене тому, що ми розглядали на двох заняттях.

## Завдання 1. Репозиторій
Створити **публічний** віддалений і локальний репозиторій (якщо ви цього ще не зробили), виконати ініціалізацію та зробити **початковий коміт у гілці `main`**.

## Завдання 2. Сторінка в новій гілці
У локальному репозиторії створити нову гілку, перемкнутися на неї й створити файл `index.html`: нескладну сторінку з темою на ваш розсуд. Вимоги до сторінки:
- один заголовок першого рівня й **не менше двох** заголовків другого рівня;
- **не менше трьох** абзаців;
- невелика **таблиця** з інформацією по темі;
- **одне зображення**, тематично пов’язане зі змістом;
- **гіперпосилання**;
- базова структура **HTML5**, семантично коректні теги та атрибути.

Мета — показати, що ви знаєте базові теги й можете створити просту сторінку.

## Завдання 3. Фіксація та публікація
Виконати фіксацію й публікацію змін, як на минулому та сьогоднішньому занятті: створити **pull request** і **code review**. **Викладачку потрібно додати до code review обов’язково**: вона перевірятиме роботу й одразу писатиме фідбеки на GitHub, щоб вони зберігалися. Як саме її додати, лекторка напише в чаті.

Якщо будуть рекомендації, роботу можна виправити та знову опублікувати, щоб викладачка побачила виправлення. Після перевірки потрібно виконати **синхронізацію**: об’єднати зміни з гілки в `main` локального й віддаленого репозиторіїв (докладний опис є в матеріалах).

## Що має вийти
- віддалений репозиторій на GitHub;
- локальний репозиторій, підключений до нього й синхронізований;
- гілка зі створеною сторінкою;
- pull request із викладачкою у reviewers.

## Самостійна частина
Одразу після заняття в чаті групи (WhatsApp) опублікують **посилання на відео** про основи HTML: що це таке, як будується сторінка, яка в неї структура. Усе потрібне для домашнього завдання можна самостійно опрацювати за цим відео. Також буде кілька посилань на **довідники з тегів**.

Якщо є запитання, лекторка готова відповісти.
