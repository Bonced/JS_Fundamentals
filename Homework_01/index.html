# Главное за минуту
- СКВ хранит историю проекта; Git это распределённая система: у каждого полная копия репозитория.
- Путь изменений: рабочий каталог → индекс → коммит → удалённый репозиторий.
- Ветка это указатель на коммит, а не копия папки.
- Работаем в своей ветке, в main попадаем через pull request.
- После слияния: switch на main, pull, удалить ненужную ветку.
- Перед любой командой смотри git status.

# Лекция 02. Основы Git и GitHub
## Зачем нужна СКВ
- Отслеживает, сохраняет и помогает управлять изменениями файлов проекта на протяжении жизни проекта.
- Даёт историю версий, сравнение и откат, командную работу, параллельную разработку в ветках, поиск конфликтов и авторство изменений.
- Применяется не только к коду: конфиги, документация, любые ресурсы проекта.

## Три типа СКВ
- **Локальные:** история на твоём компьютере. Просто и автономно, но нет совместной работы.
- **Централизованные:** главный репозиторий на сервере, у разработчиков рабочие копии. Почти всё зависит от доступности сервера.
- **Распределённые (Git):** у каждого полный репозиторий. Коммиты, ветки и история работают автономно, обмен через push и pull.

> Пояснение: в централизованной системе без сервера нельзя даже посмотреть историю. В Git сервер нужен только для обмена кодом.

## Как работает Git
1. **Снимки (snapshots).** Git фиксирует состояние всех файлов, а не разницу между версиями.
2. **Экономия места.** Неизменённый файл не копируется, снимок ссылается на уже сохранённый.
3. **Коммит** содержит ссылку на дерево файлов, автора, дату, сообщение и ссылку на родительский коммит.
4. **Адресация по содержимому:** объекты имеют криптографический хэш, поэтому видна целостность данных.

> Пояснение: хэш это длинный идентификатор вида a1b2c3d, он нужен, например, чтобы откатиться к конкретному коммиту.

## Архитектура Git
- **Рабочий каталог:** папка с файлами, где ты правишь. Изменения в историю сами не попадают.
- **Индекс (staging):** зона подготовки следующего коммита. Позволяет включить только нужные изменения.
- **Локальный репозиторий:** хранилище в скрытой папке .git. Не удаляй её: пропадёт вся история.
- **Удалённый репозиторий:** GitHub, GitLab. Нужен для обмена кодом. Для личной работы не обязателен.

> Пояснение: add и commit это два шага, чтобы собирать логически законченные коммиты: например, правку стилей отдельно от новой функции.

## Основные операции
- Вверх: `add` (в индекс), `commit` (в историю), `push` (в удалённый).
- Вниз: `pull` (забрать и влить), `fetch` (только скачать), `merge` (объединить ветки).
- `switch` и `restore` заменили многофункциональный `checkout`.

## Установка и настройка
- На Windows ставь Git вместе с Git Bash: это Unix-подобный терминал, команды как на macOS и Linux. Пути: `/` в macOS и Linux, `\` в Windows.
- Терминал важен: на серверах и в корпоративных сетях веб-интерфейса GitHub может не быть.

```bash
git --version                         # проверить установку
git config --global user.name "Имя"   # имя автора коммитов
git config --global user.email "a@b.c" # email автора
git config --list                     # проверить настройки
```

## Практика
```bash
git init -b main                      # создать репозиторий с веткой main
touch index.html                      # создать пустой файл
git status                            # файл будет untracked
git add .                             # подготовить все изменения
git commit -m "Добавление первого ДЗ" # зафиксировать
git log --oneline                     # короткая история
git remote add origin URL             # связать с GitHub
git remote -v                         # проверить связь
git push -u origin main               # отправить, запомнить связь
```
- Сообщение коммита должно говорить, что именно изменилось: добавил, обновил, исправил.
- Всегда проверяй, в какой папке ты находишься: частая ошибка новичка, когда Git «не находит репозиторий».
- Пушить прямо в main это плохая практика, поэтому следующая лекция про ветки.
- GitHub при push может запросить вход. Пароль по HTTPS не принимается: нужен вход через браузер, токен или SSH.

> Пояснение: .gitignore лектор создала для системного файла macOS (скорее всего .DS_Store). Это пример файла, который не нужен в истории.

# Лекция 03. Ветки и pull request
## Повтор: fast-forward
- Лектор правила файл прямо на GitHub. Локально изменение само не появилось.
- `git pull` забрал его и обновил файл способом fast-forward: указатель ветки сдвинулся без коммита слияния.
- Это работает, если в локальной ветке нет своих коммитов. Если они есть и там, и там, понадобится слияние (тема следующей лекции).

## Что такое ветка
- Ветка нужна, чтобы работать над задачей, не ломая основную версию.
- До момента ветвления у веток общая история, потом у каждой свои коммиты.
- Создание ветки не копирует папку. Работаешь в той же папке, а новые коммиты идут в новую ветку.

## Практика с веткой
```bash
git branch                            # список веток, активная со звёздочкой
git branch homework-01                # создать, но не переключаться
git switch homework-01                # переключиться
git switch -c homework-01             # создать и переключиться сразу
git add .                             # после правок
git commit -m "Добавление style.css"  # коммит в ветке
git switch main                       # style.css исчезнет из папки
git log --oneline --graph --all       # история всех веток графом
```
> Пояснение: файл не удалился. Git подменяет рабочую папку состоянием выбранной ветки. Поэтому перед переключением нужно делать коммит.

## Pull request и code review
- Публикация ветки: `git push -u origin homework-01`. GitHub сам предложит создать pull request.
- Pull request это запрос на включение изменений из одной ветки (исходной) в другую (целевую, у нас main).
- Создание PR ничего не сливает, слияние только после подтверждения.
- Вкладки: Conversation (обсуждение), Commits, Files changed (сравнение, новое подсвечено зелёным).
- Во вкладке Files changed можно оставить комментарий к строке. Это и есть code review.

## Способы слияния на GitHub
- **Create a merge commit:** сохраняет историю и добавляет коммит слияния. Использовала лектор.
- **Squash and merge:** все коммиты ветки сжимаются в один.
- **Rebase and merge:** коммиты переносятся поверх целевой ветки без коммита слияния.

## После слияния
- Слияние прошло только на GitHub: локальный main ещё старый.
- Нужно `git switch main` и `git pull` (снова fast-forward).
- Ненужную ветку удаляют: `git branch -d homework-01`. Флаг `-d` безопасный: Git откажет, если ветка не влита.

> Пояснение: результат работы остаётся в истории main. `-D` удаляет принудительно, с ним осторожнее. Ветку на GitHub удаляют кнопкой после слияния или `git push origin --delete имя`.

# Инструкция: полный цикл
```bash
git switch main                       # 1. на основную ветку
git pull                              #    с актуальным состоянием
git switch -c homework-01             # 2. новая ветка
git status                            # 3. что изменилось
git add .                             #    подготовить
git commit -m "Что сделал"            #    зафиксировать
git push -u origin homework-01        # 4. отправить ветку
```
- На GitHub: создать pull request, пройти review, выбрать способ слияния, подтвердить.
```bash
git switch main                       # 5. вернуться
git pull                              #    забрать результат
git branch -d homework-01             # 6. удалить ветку
```
## Типичные ошибки
- Работа в main вместо ветки: проверь `git branch`.
- Переключился без коммита и «пропали» файлы: вернись и закоммить.
- Забыл `git pull` на main после слияния: локально новых файлов нет.
- `git branch -d` отказывает: ветка не влита, проверь PR.
- `not a git repository`: ты не в папке репозитория.
- `remote origin already exists`: смотри `git remote -v`.
